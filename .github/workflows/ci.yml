name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix flake check --no-update-lock-file
      - run: nix run --no-update-lock-file .#design-gate-check -- docs/design

  applications:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        application:
          [
            checkout,
            email_portal,
            extractor,
            financial_recovery,
            research_agent,
            secure_mcp,
            sso_portal,
            support_desk,
            tool_hub,
            webhooks,
            session_replay,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - env:
          APPLICATION: ${{ matrix.application }}
        run: nix develop --no-update-lock-file --command bash scripts/test-applications.sh "$APPLICATION"

  experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - run: nix develop --no-update-lock-file --command bash scripts/test-experiments.sh

  ci:
    name: CI
    if: always()
    needs: [quality, applications, experiments]
    runs-on: ubuntu-24.04
    steps:
      - env:
          QUALITY: ${{ needs.quality.result }}
          APPLICATIONS: ${{ needs.applications.result }}
          EXPERIMENTS: ${{ needs.experiments.result }}
        run: test "$QUALITY" = success && test "$APPLICATIONS" = success && test "$EXPERIMENTS" = success
