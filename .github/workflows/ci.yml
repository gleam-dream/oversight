name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v31
      - name: Local-source capture behavior
        run: nix develop --no-update-lock-file --command python3 -B -m unittest discover -s scripts -p 'test_*.py'
      - run: nix run --no-update-lock-file .#design-gate-check -- docs/design
      - name: README snippets
        run: nix run --no-update-lock-file .#snips -- --check --commands deny README.md apps/financial_recovery/README.md

  # Every flake check: formatting, shared dependencies, each application's
  # OTP load and each application's tests in the Nix sandbox. One job builds
  # the shared compiled dependencies once for all of them.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v31
      # Compilation has no timing assertions, so it uses every core.
      - name: Compile the applications and their tests
        run: |
          # shellcheck disable=SC2016 # Nix expressions, not shell.
          packages='packages: map (name: ".#packages.x86_64-linux.${name}") (builtins.attrNames packages)'
          # shellcheck disable=SC2016
          tests='checks: map (name: ".#checks.x86_64-linux.${name}.compiled") (builtins.filter (name: builtins.match ".*-tests" name != null) (builtins.attrNames checks))'
          mapfile -t targets < <(
            nix eval --no-update-lock-file --json .#packages.x86_64-linux --apply "$packages" | jq -r '.[]'
            nix eval --no-update-lock-file --json .#checks.x86_64-linux --apply "$tests" | jq -r '.[]'
          )
          nix build --no-update-lock-file --no-link "${targets[@]}"
      # Some suites assert on deadlines and leases; two at a time on this
      # four-core runner keeps them from starving each other.
      - name: Build the checks
        run: >-
          nix run --no-update-lock-file --inputs-from . nixpkgs#nix-fast-build --
          --no-nom --skip-cached --no-link --max-jobs 2 --flake .#checks.x86_64-linux
      - name: Test reports
        if: always()
        run: |
          for check in $(nix eval --no-update-lock-file --raw .#checks.x86_64-linux --apply 'checks: builtins.concatStringsSep " " (builtins.filter (name: builtins.match ".*-tests" name != null) (builtins.attrNames checks))'); do
            report=$(nix build --no-update-lock-file --no-link --print-out-paths --max-jobs 0 ".#checks.x86_64-linux.$check" 2>/dev/null)/report || continue
            printf '%s: %s tests\n' "$check" "$(awk '{ total += $3 } END { print total }' "$report")"
          done

  experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v31
      - run: nix develop --no-update-lock-file --command bash scripts/test-experiments.sh

  ci:
    name: CI
    if: always()
    needs: [quality, checks, experiments]
    runs-on: ubuntu-24.04
    steps:
      - env:
          QUALITY: ${{ needs.quality.result }}
          CHECKS: ${{ needs.checks.result }}
          EXPERIMENTS: ${{ needs.experiments.result }}
        run: test "$QUALITY" = success && test "$CHECKS" = success && test "$EXPERIMENTS" = success
