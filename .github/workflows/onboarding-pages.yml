name: Onboarding site
on:
  push:
    branches: [main]
    paths:
      - "onboarding/site/**"
      - "booklets/**"
      - "nix/booklets.nix"
      - ".github/workflows/onboarding-pages.yml"
  # Pull requests run the checks and the build, never the deploy.
  pull_request:
    paths:
      - "onboarding/site/**"
      - "booklets/**"
      - "nix/booklets.nix"
      - ".github/workflows/onboarding-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a
# deployment that is already publishing. Each pull request checks apart.
concurrency:
  group: onboarding-pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Gleam, Erlang, Node and esbuild come from the flake lock, as in ci.yml.
      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v31
      - name: Snippets
        working-directory: onboarding/site
        # The snippets compile and pass their tests, the recorded compiler
        # errors are current, and the generated module matches its sources.
        run: |
          nix develop --no-update-lock-file ../.. --command bash -c \
            'cd snippets && gleam test && bash capture.sh && python3 -B generate.py'
          git diff --exit-code -- snippets/output src/pages/gleam_lang/snippets.gleam
      - name: Test
        working-directory: onboarding/site
        run: nix develop --no-update-lock-file ../.. --command gleam test
      - name: Build
        working-directory: onboarding/site
        run: nix develop --no-update-lock-file ../.. --command bash build.sh
      - name: Booklets
        # Each booklet's PDF, published at booklets/<slug>.pdf beside the
        # course, which links to it.
        run: |
          booklets=$(nix build --no-update-lock-file --no-link --print-out-paths .#booklets)
          cp -R "$booklets" onboarding/site/dist/booklets
          chmod -R u+w onboarding/site/dist/booklets
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: onboarding/site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
