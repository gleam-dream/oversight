name: Onboarding site
on:
  push:
    branches: [main]
    paths:
      - "onboarding/site/**"
      - ".github/workflows/onboarding-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits rather than cancelling a
# deployment that is already publishing.
concurrency:
  group: onboarding-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Gleam, Erlang, Node and esbuild come from the flake lock, as in ci.yml.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Test
        working-directory: onboarding/site
        run: nix develop --no-update-lock-file ../.. --command gleam test
      - name: Build
        working-directory: onboarding/site
        run: nix develop --no-update-lock-file ../.. --command bash build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: onboarding/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
