name: Ecosystem compatibility
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-siblings:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: oversight
          persist-credentials: false
      - uses: ./oversight/.github/actions/siblings
        with:
          current: "true"
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      - working-directory: oversight
        run: nix develop --no-update-lock-file --command python3 -B scripts/ci.py full
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: current-siblings
          path: oversight/.artifacts/ci
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
