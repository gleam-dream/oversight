name = "archive_release"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
pog = ">= 4.1.0 and < 4.2.0"
# fabric_postgres has no release tag for Fabric 0.6 yet, and it depends on
# the Fabric core in its own repository, so both come from one Fabric commit.
fabric = { git = "https://github.com/gleam-dream/fabric.git", ref = "e451366ee7318127f1077965139b5481b1ae4128" }
fabric_postgres = { git = "https://github.com/gleam-dream/fabric.git", ref = "e451366ee7318127f1077965139b5481b1ae4128", path = "integrations/fabric_postgres" }
hellhound = ">= 0.4.0 and < 0.5.0"
relay = ">= 0.3.0 and < 0.4.0"
json_blueprint = ">= 3.0.0 and < 3.1.0"
sinal = ">= 0.2.0 and < 0.3.0"
[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
