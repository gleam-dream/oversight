name = "secure_mcp"
version = "0.1.0"
target = "erlang"
description = "Composition app: an OAuth-protected MCP report server (relay + warden + grind)."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.0.0 and < 2.0.0"
wisp = ">= 2.0.0 and < 3.0.0"
mist = ">= 5.0.0 and < 7.0.0"
pog = ">= 4.0.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
relay = { git = "https://github.com/gleam-dream/relay.git", ref = "d6ad27d193d240101c0f1c150b6c731698c9224b" }
warden = { git = "https://github.com/gleam-dream/warden.git", ref = "0cd5c446bf2c95128bc84084a71e0ef749778540" }
grind = { git = "https://github.com/gleam-dream/grind.git", ref = "bd111adff515d120713e4e22d64798d8bcc6eef3" }
json_blueprint = { git = "https://github.com/lostbean/json_blueprint.git", ref = "8a67eb858d2476a87bd7cc76ab31628a6aeae813" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "9727f9baab6ed4f796780a0c3a1027c3292c5fc7" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
