name = "secure_mcp"
version = "0.1.0"
target = "erlang"
description = "Composition app: an OAuth-protected MCP report server (relay + hellhound + grind)."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.0.0 and < 2.0.0"
wisp = ">= 2.0.0 and < 3.0.0"
mist = ">= 5.0.0 and < 7.0.0"
pog = ">= 4.0.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
relay = ">= 0.2.1 and < 0.3.0"
hellhound = ">= 0.3.0 and < 0.4.0"
grind = ">= 0.1.1 and < 0.2.0"
json_blueprint = ">= 2.2.0 and < 3.0.0"
# Owner-bound handlers and the bounded collector, unreleased
# (gleam-dream/sinal#15). Replace with the Hex release once published.
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "32d25f2e2bf59c8d1a8f15c45b374ec8032ff38e" }
http_gun = ">= 0.2.0 and < 0.3.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
