name = "secure_mcp"
version = "0.1.0"
target = "erlang"
description = "Composition app: an OAuth-protected MCP report server (relay + hellhound + grind)."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.0.0 and < 2.0.0"
wisp = ">= 2.0.0 and < 3.0.0"
mist = ">= 5.0.0 and < 7.0.0"
pog = ">= 4.0.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
relay = { git = "https://github.com/gleam-dream/relay.git", ref = "0f81df9e163f5f7a29ee8a724ea29dee0647117f" }
hellhound = { git = "https://github.com/gleam-dream/hellhound.git", ref = "2f3ac56d665218c3ce0f2b12e6ff11fd9e54bec6" }
grind = { git = "https://github.com/gleam-dream/grind.git", ref = "353c8ffe282d6cf61ff4e90820fb3f7357ddb1bd" }
json_blueprint = { git = "https://github.com/lostbean/json_blueprint.git", ref = "8bc8ab4e7d04b23d209680f849e976074bf7c90f" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "95f2dbce4459942e16e819e3527eb00d9c503c9d" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
