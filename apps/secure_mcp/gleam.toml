name = "secure_mcp"
version = "0.1.0"
target = "erlang"
description = "Composition app: an OAuth-protected MCP report server (relay + warden + grind)."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
wisp = ">= 2.0.0 and < 3.0.0"
mist = ">= 5.0.0 and < 7.0.0"
pog = ">= 4.0.0 and < 5.0.0"
gleam_httpc = ">= 5.0.0 and < 6.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
relay = { path = "../../../relay" }
warden = { path = "../../../warden" }
grind = { path = "../../../grind" }
json_blueprint = { path = "../../../json_blueprint" }
sinal = { path = "../../../sinal" }
# Workaround SMCP-1: warden pins gleam_crypto == 1.6.0 (stdlib >= 1.0) while
# relay and grind cap gleam_stdlib < 1.0.0. This app-local copy of
# gleam_crypto 1.6.0 only relaxes its stdlib range.
gleam_crypto = { path = "vendor/gleam_crypto" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
