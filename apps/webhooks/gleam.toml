name = "webhooks"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
description = "Composition app: durable, signed outbound webhooks on grind + http_gun + sinal, served by wisp/mist on pog."

[dependencies]
grind = { path = "../../../grind" }
http_gun = { path = "../../../http_gun" }
sinal = { path = "../../../sinal" }
gleam_stdlib = ">= 0.70.0 and < 1.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_crypto = ">= 1.5.0 and < 2.0.0"
gleam_time = ">= 1.0.0 and < 2.0.0"
pog = ">= 4.1.0 and < 5.0.0"
wisp = ">= 2.0.0 and < 3.0.0"
mist = ">= 6.0.2 and < 7.0.0"
envoy = ">= 1.0.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
