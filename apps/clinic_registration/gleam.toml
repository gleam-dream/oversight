name = "clinic_registration"
version = "0.1.0"
target = "erlang"
description = "Composition app: registering a patient from a conversation through a decision point, built from decisions, decisions_postgres, decisions_otp, llm_wire, grind, hellhound, wisp and sinal on pog and mist."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
# One pool for the app, Grind and decisions_postgres: both pin pog 4.1.x.
pog = ">= 4.1.0 and < 4.2.0"
wisp = ">= 2.0.0 and < 3.0.0"
mist = ">= 6.0.0 and < 7.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
grind = { git = "https://github.com/gleam-dream/grind.git", ref = "22802b7f3015f72e7775c67ee3ed3079a0229319" }
http_gun = { git = "https://github.com/gleam-dream/http_gun.git", ref = "0d6558c9ede95fab9a6bbf287ecd363e05b0fbcb" }
llm_wire = { git = "https://github.com/gleam-dream/llm_wire.git", ref = "016d71c3a68ee8eaedc818821ba16ee65427a3f3" }
json_blueprint = { git = "https://github.com/gleam-dream/json_blueprint.git", ref = "3adcf515bcc91beb8b40f025c5dc81c4f863b1cf" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "29ea7a90bf820b3c91eb3f76e824abe0d034d78f" }
hellhound = { git = "https://github.com/gleam-dream/hellhound.git", ref = "78acabc2df82d0780099cb9a19a169dd4c8e3c6a" }
# The core is on Hex. The two integrations are released as Git tags of
# gleam-dream/decisions.
decisions = ">= 0.1.1 and < 0.2.0"
decisions_otp = { git = "https://github.com/gleam-dream/decisions.git", ref = "decisions_otp-v0.1.1", path = "integrations/decisions_otp" }
decisions_postgres = { git = "https://github.com/gleam-dream/decisions.git", ref = "decisions_postgres-v0.2.1", path = "integrations/decisions_postgres" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
