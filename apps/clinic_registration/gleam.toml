name = "clinic_registration"
version = "0.1.0"
target = "erlang"
description = "Composition app: registering a patient from a conversation through a decision point, built from decisions, decisions_postgres, decisions_otp, llm_wire, grind, wisp and sinal on pog and mist."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
# One pool for the app, Grind and decisions_postgres: both pin pog 4.1.x.
pog = ">= 4.1.0 and < 4.2.0"
wisp = ">= 2.0.0 and < 3.0.0"
mist = ">= 6.0.0 and < 7.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
grind = ">= 0.1.1 and < 0.2.0"
http_gun = ">= 0.2.0 and < 0.3.0"
llm_wire = ">= 0.2.0 and < 0.3.0"
json_blueprint = ">= 2.2.0 and < 3.0.0"
# Owner-bound handlers and the bounded collector, unreleased
# (gleam-dream/sinal#15). Replace with the Hex release once published.
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "32d25f2e2bf59c8d1a8f15c45b374ec8032ff38e" }
# The core is on Hex. The two integrations are released as Git tags of
# gleam-dream/decisions.
decisions = ">= 0.1.0 and < 0.2.0"
decisions_otp = { git = "https://github.com/gleam-dream/decisions.git", ref = "decisions_otp-v0.1.0", path = "integrations/decisions_otp" }
decisions_postgres = { git = "https://github.com/gleam-dream/decisions.git", ref = "decisions_postgres-v0.1.0", path = "integrations/decisions_postgres" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
