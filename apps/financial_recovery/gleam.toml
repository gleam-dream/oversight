name = "financial_recovery"
version = "0.1.0"
target = "erlang"
description = "Executable financial recovery recipe with Saga, Grind and PostgreSQL."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
pog = ">= 4.1.0 and < 4.2.0"
envoy = ">= 1.0.0 and < 2.0.0"
saga = ">= 0.2.0 and < 0.3.0"
saga_postgres = { git = "https://github.com/gleam-dream/saga.git", ref = "saga_postgres-v0.1.0", path = "integrations/saga_postgres" }
grind = ">= 0.1.1 and < 0.2.0"
http_gun = ">= 0.2.0 and < 0.3.0"
# Owner-bound handlers and the bounded collector, unreleased
# (gleam-dream/sinal#15). Replace with the Hex release once published.
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "32d25f2e2bf59c8d1a8f15c45b374ec8032ff38e" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
