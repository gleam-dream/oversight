name = "research_agent"
version = "0.1.0"
target = "erlang"
description = "Composition app: a long-running research agent driven by grind jobs, checkpointed by fabric in Postgres, published through a durable saga."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
pog = ">= 4.1.0 and < 4.2.0"
mist = ">= 6.0.2 and < 7.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
fabric = { git = "https://github.com/gleam-dream/fabric.git", ref = "main" }
fabric_postgres = { git = "https://github.com/gleam-dream/fabric.git", ref = "main", path = "integrations/fabric_postgres" }
grind = { git = "https://github.com/gleam-dream/grind.git", ref = "main" }
saga = { git = "https://github.com/gleam-dream/saga.git", ref = "main" }
saga_postgres = { git = "https://github.com/gleam-dream/saga.git", ref = "main", path = "integrations/saga_postgres" }
llm_wire = { git = "https://github.com/gleam-dream/llm_wire.git", ref = "main" }
http_gun = { git = "https://github.com/gleam-dream/http_gun.git", ref = "main" }
json_blueprint = { git = "https://github.com/lostbean/json_blueprint.git", ref = "main" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "main" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
