name = "research_agent"
version = "0.1.0"
target = "erlang"
description = "Composition app: a long-running research agent driven by grind jobs, checkpointed by fabric in Postgres, published through a durable saga."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
pog = ">= 4.1.0 and < 4.2.0"
mist = ">= 6.0.2 and < 7.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
# fabric_postgres has no release tag for Fabric 0.6 yet, and it depends on
# the Fabric core in its own repository, so both come from one Fabric commit.
fabric = { git = "https://github.com/gleam-dream/fabric.git", ref = "e451366ee7318127f1077965139b5481b1ae4128" }
fabric_postgres = { git = "https://github.com/gleam-dream/fabric.git", ref = "e451366ee7318127f1077965139b5481b1ae4128", path = "integrations/fabric_postgres" }
grind = ">= 0.3.0 and < 0.4.0"
saga = ">= 0.3.0 and < 0.4.0"
saga_postgres = { git = "https://github.com/gleam-dream/saga.git", ref = "saga_postgres-v0.2.0", path = "integrations/saga_postgres" }
llm_wire = ">= 0.3.0 and < 0.4.0"
http_gun = ">= 0.4.0 and < 0.5.0"
json_blueprint = ">= 3.0.0 and < 3.1.0"
sinal = ">= 0.2.0 and < 0.3.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
