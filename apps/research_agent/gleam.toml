name = "research_agent"
version = "0.1.0"
target = "erlang"
description = "Composition app: a long-running research agent driven by grind jobs, checkpointed by fabric in Postgres, published through a durable saga."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
pog = ">= 4.1.0 and < 4.2.0"
mist = ">= 6.0.2 and < 7.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
fabric = { git = "https://github.com/gleam-dream/fabric.git", ref = "3871be23e72754345c0525b067e518fefb3b434d" }
fabric_postgres = { git = "https://github.com/gleam-dream/fabric.git", ref = "3871be23e72754345c0525b067e518fefb3b434d", path = "integrations/fabric_postgres" }
grind = { git = "https://github.com/gleam-dream/grind.git", ref = "22802b7f3015f72e7775c67ee3ed3079a0229319" }
saga = { git = "https://github.com/gleam-dream/saga.git", ref = "7349b1bb853912910eb51f9a4dfa65dcb1dd2452" }
saga_postgres = { git = "https://github.com/gleam-dream/saga.git", ref = "7349b1bb853912910eb51f9a4dfa65dcb1dd2452", path = "integrations/saga_postgres" }
llm_wire = { git = "https://github.com/gleam-dream/llm_wire.git", ref = "016d71c3a68ee8eaedc818821ba16ee65427a3f3" }
http_gun = { git = "https://github.com/gleam-dream/http_gun.git", ref = "0d6558c9ede95fab9a6bbf287ecd363e05b0fbcb" }
json_blueprint = { git = "https://github.com/gleam-dream/json_blueprint.git", ref = "3adcf515bcc91beb8b40f025c5dc81c4f863b1cf" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "29ea7a90bf820b3c91eb3f76e824abe0d034d78f" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
