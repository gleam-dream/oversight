name = "research_agent"
version = "0.1.0"
target = "erlang"
description = "Composition app: a long-running research agent driven by grind jobs, checkpointed by fabric in Postgres, published through a durable saga."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
pog = ">= 4.1.0 and < 4.2.0"
mist = ">= 6.0.2 and < 7.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
fabric = ">= 0.1.0 and < 0.2.0"
fabric_postgres = { git = "https://github.com/gleam-dream/fabric.git", ref = "fdbe9960336c0908a6d9af9caa3874e141768aea", path = "integrations/fabric_postgres" }
grind = ">= 0.1.0 and < 0.2.0"
saga = ">= 0.1.0 and < 0.2.0"
saga_postgres = { git = "https://github.com/gleam-dream/saga.git", ref = "aea8e5df8ca9e9ad7048020a1205408eeba53a9f", path = "integrations/saga_postgres" }
llm_wire = ">= 0.1.0 and < 0.2.0"
http_gun = ">= 0.1.0 and < 0.2.0"
json_blueprint = ">= 2.0.0 and < 3.0.0"
sinal = ">= 0.1.0 and < 0.2.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
