name = "payout_desk"
version = "0.1.0"
target = "erlang"
description = "Composition app: a support agent's payout tool call gated by a decision point, decided over MCP, paid through a durable saga, built from decisions, decisions_postgres, fabric, fabric_postgres, relay, mist, grind, saga, saga_postgres, hellhound and sinal."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
pog = ">= 4.1.0 and < 4.2.0"
pgo = ">= 0.20.0 and < 0.21.0"
mist = ">= 6.0.2 and < 7.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
fabric = ">= 0.3.1 and < 0.4.0"
fabric_postgres = { git = "https://github.com/gleam-dream/fabric.git", ref = "b0cf82c6785309df0266648da53d5b76c90046ec", path = "integrations/fabric_postgres" }
grind = ">= 0.1.1 and < 0.2.0"
saga = ">= 0.2.0 and < 0.3.0"
saga_postgres = { git = "https://github.com/gleam-dream/saga.git", ref = "0d345cacf777515f2c9401d1ad90f5d67b07f38e", path = "integrations/saga_postgres" }
relay = ">= 0.2.0 and < 0.3.0"
hellhound = ">= 0.2.1 and < 0.3.0"
json_blueprint = ">= 2.0.0 and < 3.0.0"
sinal = ">= 0.1.0 and < 0.2.0"
# The decisions packages are not published yet: Git+path pins to one verified
# commit of gleam-dream/decisions, as fabric_postgres and saga_postgres are above.
decisions = { git = "https://github.com/gleam-dream/decisions.git", ref = "4691bcec7ef899a00819ea4bed462cb6311268d6" }
decisions_postgres = { git = "https://github.com/gleam-dream/decisions.git", ref = "4691bcec7ef899a00819ea4bed462cb6311268d6", path = "integrations/decisions_postgres" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
