name = "sso_portal"
version = "0.1.0"
target = "erlang"
description = "Composition app: OIDC portal with Postgres sessions and a token-protected billing API (warden, http_gun, sinal, wisp, mist, pog)."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_crypto = ">= 1.6.0 and < 2.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
wisp = ">= 2.0.0 and < 3.0.0"
mist = ">= 5.0.0 and < 7.0.0"
pog = ">= 4.0.0 and < 5.0.0"
envoy = ">= 1.0.0 and < 2.0.0"
warden = { git = "https://github.com/gleam-dream/warden.git", ref = "0cd5c446bf2c95128bc84084a71e0ef749778540" }
http_gun = { git = "https://github.com/gleam-dream/http_gun.git", ref = "e4f00b8525e20a7b568b2cd585fe4e37db161b26" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "9727f9baab6ed4f796780a0c3a1027c3292c5fc7" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
