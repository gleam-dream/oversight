name = "email_portal"
version = "0.1.0"
target = "erlang"
description = "Retained Correio consumer: captured delivery, development inspection, and application session recovery."
licences = ["Apache-2.0"]

[dependencies]
correio = { git = "https://github.com/gleam-dream/correio.git", ref = "main" }
correio_mailbox = { git = "https://github.com/gleam-dream/correio.git", ref = "main", path = "adapters/correio_mailbox" }
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
