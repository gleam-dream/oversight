name = "support_desk"
version = "0.1.0"
target = "erlang"
description = "Composition app: a customer-support agent whose refunds need approval and run as a compensating saga, built from fabric, llm_wire, http_gun, json_blueprint, saga and sinal."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
mist = ">= 6.0.2 and < 7.0.0"
fabric = { git = "https://github.com/gleam-dream/fabric.git", ref = "4daccd5d0114bc21841c08c1230fe9f000eaabc1" }
saga = { git = "https://github.com/gleam-dream/saga.git", ref = "fed752110dccb4ee5978c0f42d2fd10d77cb0a15" }
llm_wire = { git = "https://github.com/gleam-dream/llm_wire.git", ref = "2c5eaea0e4af4db68ebc02f0ae10a7f0e6642276" }
http_gun = { git = "https://github.com/gleam-dream/http_gun.git", ref = "b2fe1d7cd0ea121e679cdf2c4af5b078330c33e7" }
json_blueprint = { git = "https://github.com/lostbean/json_blueprint.git", ref = "8bc8ab4e7d04b23d209680f849e976074bf7c90f" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "95f2dbce4459942e16e819e3527eb00d9c503c9d" }
hellhound = { git = "https://github.com/gleam-dream/hellhound.git", ref = "2f3ac56d665218c3ce0f2b12e6ff11fd9e54bec6" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
