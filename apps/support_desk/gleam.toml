name = "support_desk"
version = "0.1.0"
target = "erlang"
description = "Composition app: a customer-support agent whose refunds need approval and run as a compensating saga, built from fabric, llm_wire, http_gun, json_blueprint, saga and sinal."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
mist = ">= 6.0.2 and < 7.0.0"
fabric = { git = "https://github.com/gleam-dream/fabric.git", ref = "15f1391f545a8e56f76d2384d231d55a30f47c2a" }
saga = { git = "https://github.com/gleam-dream/saga.git", ref = "5c04121e2a98f93d0260902bad821b7449462095" }
llm_wire = { git = "https://github.com/gleam-dream/llm_wire.git", ref = "f9c597fcf5a3f37c0c67d75f0cae669dc9142f63" }
http_gun = { git = "https://github.com/gleam-dream/http_gun.git", ref = "9360c2481d920d2fdcddcf517886b337c28ec162" }
json_blueprint = { git = "https://github.com/lostbean/json_blueprint.git", ref = "0015fc50ddfd334b9c44253c36dc429d29a5845d" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "4aee4c3b920bd7241da7659995dfc0a0b5767348" }
warden = { git = "https://github.com/gleam-dream/warden.git", ref = "f28183ebcb8085707054ea7d9b423abd36b649c4" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
