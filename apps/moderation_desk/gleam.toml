name = "moderation_desk"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
description = "Composition app: moderation at volume on the BEAM with no database, built from decisions, decisions_otp and sinal."

[dependencies]
# decisions and decisions_otp are unpublished: Git+path pins to one verified
# commit of gleam-dream/decisions.
decisions = { git = "https://github.com/gleam-dream/decisions.git", ref = "33279f78e618cc3139936b444959b85a4517eacf" }
decisions_otp = { git = "https://github.com/gleam-dream/decisions.git", ref = "33279f78e618cc3139936b444959b85a4517eacf", path = "integrations/decisions_otp" }
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
json_blueprint = ">= 2.0.0 and < 3.0.0"
sinal = ">= 0.1.0 and < 0.2.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
