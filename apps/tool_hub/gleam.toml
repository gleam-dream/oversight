name = "tool_hub"
version = "0.1.0"
target = "erlang"
description = "Composition app: MCP in both directions with relay, fabric, llm_wire, json_blueprint, http_gun and sinal."
licences = ["Apache-2.0"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
gleam_http = ">= 4.4.0 and < 5.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
mist = ">= 6.0.2 and < 7.0.0"
relay = { git = "https://github.com/gleam-dream/relay.git", ref = "e8c2913fc5e7294931c1fb5aa0df348ac71e5065" }
fabric = { git = "https://github.com/gleam-dream/fabric.git", ref = "85cf543fbb2031b76701fc4e3f4b79fdd22fead7" }
llm_wire = { git = "https://github.com/gleam-dream/llm_wire.git", ref = "5bed4249fc91416ca7c862afbe6eb920ec56bdd6" }
json_blueprint = { git = "https://github.com/gleam-dream/json_blueprint.git", ref = "0cc991164771a85cf6496efe0d2413fd59b300cf" }
http_gun = { git = "https://github.com/gleam-dream/http_gun.git", ref = "0a1e5b9c8db5d40b2277df3fd76d89e9563fe84c" }
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "02d386e070c6a99900225c613e8d273f3bebe3c2" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
