class Mod1 extends DCLogic {
  constructor(props) {
    super(props);
    this.state = this.fresh();
  }
  fresh() {
    return {
      procs: ['web', 'cart', 'payment', 'mailer', 'cache'].map((name, i) => ({ id: i, name, alive: true, mail: [], handled: 0 })),
      from: 0, to: 1, linked: false, msgN: 0, nextId: 5,
      log: ['Five processes started. Each one has its own memory and an empty mailbox.'], ev: [],
      mode: 'pre', greedy: false, answers: {}
    };
  }
  msgName() { return ['add_item', 'get_total', 'charge', 'send_receipt', 'ping', 'refresh'][this.state.msgN % 6]; }
  say(s, extra, evs) { const log = [s].concat(this.state.log).slice(0, 12); const ev = (this.state.ev || []).concat(evs || []).slice(-10); this.setState(Object.assign({ log, ev }, extra || {})); }
  isLinkedPair(id) { return this.state.linked && (id === 1 || id === 2); }
  renderVals() {
    const st = this.state;
    const P = st.procs;
    const name = (id) => (P.find((p) => p.id === id) || {}).name;
    const upd = (id, f) => P.map((p) => (p.id === id ? f(Object.assign({}, p)) : p));
    const send = () => {
      const from = P.find((p) => p.id === st.from), to = P.find((p) => p.id === st.to);
      const m = this.msgName();
      if (!from || !to) return;
      if (!from.alive) return this.say(from.name + ' is not running, so it cannot send anything.');
      if (from.id === to.id) return this.say(from.name + ' sent "' + m + '" to itself. Allowed, and sometimes useful as a timer.', { procs: upd(to.id, (p) => { p.mail = p.mail.concat([m]); return p; }), msgN: st.msgN + 1 }, [{ f: from.id, t: to.id, label: m }]);
      if (!to.alive) return this.say(from.name + ' sent "' + m + '" to ' + to.name + ', which is dead. The send still "succeeds": the message is silently dropped. Use a monitor or a timeout to notice.', { msgN: st.msgN + 1 }, [{ f: from.id, t: to.id, label: m + ' (dropped)', lost: true, color: 'grey' }]);
      this.say(from.name + ' copied "' + m + '" into ' + to.name + '’s mailbox and moved on without waiting.', { procs: upd(to.id, (p) => { p.mail = p.mail.concat([m]); return p; }), msgN: st.msgN + 1 }, [{ f: from.id, t: to.id, label: m }]);
    };
    const receive = (id) => () => {
      const p = P.find((x) => x.id === id);
      if (!p || !p.mail.length) return;
      this.say(p.name + ' took "' + p.mail[0] + '" from its mailbox and handled it. Only ' + p.name + ' can touch its own state.', { procs: upd(id, (x) => { x.mail = x.mail.slice(1); x.handled += 1; return x; }) }, [{ f: id, kind: 'note', label: 'handles ' + p.mail[0], color: 'blue' }]);
    };
    const crash = (id) => () => {
      const p = P.find((x) => x.id === id);
      let procs = upd(id, (x) => { x.alive = false; x.mail = []; return x; });
      let msg = p.name + ' crashed. Its memory and ' + p.mail.length + ' queued message(s) are gone. ';
      const evs = [{ f: id, kind: 'crash', label: 'crashes' }];
      if (this.isLinkedPair(id)) {
        const other = id === 1 ? 2 : 1;
        const o = P.find((x) => x.id === other);
        if (o && o.alive) { procs = procs.map((x) => (x.id === other ? Object.assign({}, x, { alive: false, mail: [] }) : x)); msg += o.name + ' was linked, received an exit signal and died too. '; evs.push({ f: id, t: other, label: 'EXIT signal', color: 'red', dash: true }, { f: other, kind: 'crash', label: 'dies too' }); }
      }
      const survivors = procs.filter((x) => x.alive).map((x) => x.name);
      msg += survivors.length ? survivors.join(', ') + ' kept running untouched.' : 'Nothing is left running.';
      this.say(msg, { procs }, evs);
    };
    const restart = (id) => () => {
      this.say(name(id) + ' started again, fresh: empty mailbox, initial state. In module 2 a supervisor does this for you.', { procs: upd(id, (x) => { x.alive = true; x.handled = 0; return x; }) }, [{ f: id, kind: 'note', label: 'started again', color: 'green' }]);
    };
    const spawn = () => {
      if (P.length >= 10) return this.say('That’s enough for this demo. A real node would happily run a million more.');
      const id = st.nextId;
      this.say('Started worker-' + id + ' in microseconds, with a few KB of memory.', { procs: P.concat([{ id, name: 'worker-' + id, alive: true, mail: [], handled: 0 }]), nextId: id + 1 });
    };
    const procs = P.map((p) => {
      const linked = this.isLinkedPair(p.id);
      return Object.assign({}, p, {
        dead: !p.alive, empty: !p.mail.length, count: p.mail.length,
        status: p.alive ? 'running' : 'crashed',
        sbg: p.alive ? '#E2F4E7' : '#FDECEA', sfg: p.alive ? '#0E4D25' : '#7A1A12',
        bg: p.alive ? '#FFFFFF' : '#FBF3F2', border: linked ? '#B0186E' : (p.alive ? '#E4E0D8' : '#E9B8B2'),
        linkNote: linked ? (p.id === 1 ? 'linked ⇄ payment' : 'linked ⇄ cart') : (p.alive ? 'pid #' + (100 + p.id) : 'no longer exists'),
        receive: receive(p.id), crash: crash(p.id), restart: restart(p.id)
      });
    });
    const fromOpts = P.slice(0, 5).map((p) => ({ name: p.name, cls: st.from === p.id ? 'on' : '', pick: () => this.setState({ from: p.id }) }));
    const toOpts = P.slice(0, 5).map((p) => ({ name: p.name, cls: st.to === p.id ? 'on' : '', pick: () => this.setState({ to: p.id }) }));
    const toggleLink = () => this.say(st.linked ? 'Unlinked cart and payment. Their fates are separate again.' : 'Linked cart ⇄ payment. Now crash one of them.', { linked: !st.linked });

    // scheduling simulation
    const names = ['A', 'B', 'C', 'D'].concat(st.greedy ? ['G'] : []);
    const lanes = [[], []];
    let queue = names.slice();
    const hog = [null, null];
    for (let t = 0; t < 16; t++) {
      for (let c = 0; c < 2; c++) {
        let p;
        if (hog[c]) p = hog[c];
        else { p = queue.shift(); queue.push(p); if (st.mode === 'coop' && p === 'G') { hog[c] = 'G'; queue = queue.filter((x) => x !== 'G'); } }
        lanes[c].push(p);
      }
    }
    const last = {}; let maxWait = 0;
    for (let t = 0; t < 16; t++) for (let c = 0; c < 2; c++) {
      const p = lanes[c][t];
      if (p === 'G') continue;
      if (last[p] !== undefined) maxWait = Math.max(maxWait, t - last[p] - 1);
      last[p] = t;
    }
    ['A', 'B', 'C', 'D'].forEach((p) => { if (last[p] !== undefined) maxWait = Math.max(maxWait, 15 - last[p]); else maxWait = 16; });
    const col = { A: ['#DCD9FF', '#241F6B'], B: ['#C9E8FF', '#0B3A66'], C: ['#DDF3F0', '#0B4A45'], D: ['#FDF0DC', '#6B3404'], G: ['#B42318', '#FFFFFF'] };
    const laneVals = lanes.map((l, i) => ({ name: 'core ' + (i + 1), slots: l.map((p) => ({ p, bg: col[p][0], fg: col[p][1] })) }));
    const schedNote = !st.greedy ? 'Four well-behaved processes share two cores. Everyone gets a turn every couple of slices.'
      : st.mode === 'coop' ? 'Cooperative scheduling: the greedy process grabbed core 1 and never gave it back. Everyone else now squeezes onto one core, and if a second greedy process appeared the system would freeze. This is how a single bad loop takes down services on many runtimes.'
      : 'Preemptive scheduling, the BEAM way: the greedy process is cut off after its budget like everyone else. It gets its fair share and nothing more, so the system stays responsive.';
    const modes = [{ id: 'coop', label: 'Cooperative (most runtimes)' }, { id: 'pre', label: 'Preemptive (the BEAM)' }]
      .map((m) => ({ label: m.label, cls: st.mode === m.id ? 'on' : '', pick: () => this.setState({ mode: m.id }) }));

    return Object.assign({
      procs, fromOpts, toOpts, send, spawn, nextMsg: this.msgName(), log: st.log,
      reset: () => this.setState(this.fresh()),
      toggleLink, linkLabel: st.linked ? 'Unlink cart ⇄ payment' : 'Link cart ⇄ payment',
      linkBtnCls: st.linked ? 'btn on' : 'btn',
      procCount: P.filter((p) => p.alive).length,
      modes, lanes: laneVals, maxWait, schedNote,
      greedyCls: st.greedy ? 'btn warn' : 'btn',
      greedyLabel: st.greedy ? 'Remove the greedy process' : 'Add a greedy process (G)',
      toggleGreedy: () => this.setState({ greedy: !st.greedy })
    }, {});
  }


  extraVals() {
    const P = this.state.procs.slice(0, 6), ids = P.map((p) => p.id);
    const evs = (this.state.ev || []).filter((e) => ids.indexOf(e.f) >= 0 && (e.t == null || ids.indexOf(e.t) >= 0))
      .map((e) => Object.assign({}, e, { f: ids.indexOf(e.f), t: e.t == null ? null : ids.indexOf(e.t) }));
    const chart = GD.msc({ id: 'p1', lanes: P.map((p) => p.name), events: evs.length ? evs : [{ f: 0, kind: 'note', label: 'nothing yet: send a message', color: 'grey' }], laneGap: 150, numbers: true, aria: 'Sequence chart of messages, crashes and restarts between the processes' });
    return { procChart: chart, chartCount: evs.length ? 'last ' + evs.length + ' events' : '' };
  }
  tourDefs() {
    const pick = ($, f, t) => { $().fromOpts[f].pick(); $().toOpts[t].pick(); };
    return {
      proc: { reset: ($) => $().reset(), steps: [
        { t: 'Five processes, each with its own private memory and an empty mailbox. Press Next (or Play) to watch what a single message does.' },
        { t: 'web sends add_item to cart. The message is copied into cart’s mailbox, and web carries on immediately: sending never waits.', a: ($) => { pick($, 0, 1); $().send(); } },
        { t: 'cart takes the message out of its mailbox and handles it. Only cart can ever touch cart’s state.', a: ($) => $().procs[1].receive() },
        { t: 'Now payment crashes. Its memory and mailbox vanish, and every other process keeps running untouched.', a: ($) => $().procs[2].crash() },
        { t: 'web sends to the dead payment process. The send still "succeeds": the message is silently dropped (the lightning bolt in the chart).', a: ($) => { pick($, 0, 2); $().send(); } },
        { t: 'Start payment again, then link it to cart. A link ties two processes’ fates together.', a: ($) => { $().procs[2].restart(); $().toggleLink(); } },
        { t: 'Crash cart: payment receives an EXIT signal and dies too. That is exactly how a supervisor notices failures, in the next module.', a: ($) => $().procs[1].crash() },
        { t: 'The timeline below tells the whole story. Your turn: start processes, send messages, link and crash them.' }
      ] },
      sched: { reset: () => this.setState({ mode: 'pre', greedy: false }), steps: [
        { t: 'Two cores, four well-behaved processes. Each square is one time slice; everyone gets a turn every couple of slices.' },
        { t: 'Add a greedy process G that never stops working, on a cooperative runtime: it grabs core 1 and never gives it back.', a: ($) => { $().modes[0].pick(); if (!this.state.greedy) $().toggleGreedy(); } },
        { t: 'Same greedy process, BEAM style: the scheduler cuts it off after its work budget, like everyone else. The longest wait drops right back down.', a: ($) => $().modes[1].pick() },
        { t: 'That fairness is why one runaway loop can’t freeze a BEAM service. Try the switches yourself.' }
      ] }
    };
  }

}

class Mod2 extends DCLogic {
  constructor(props) {
    super(props);
    this.state = Object.assign({ answers: {}, plug: 0 }, this.actor0(), this.tree0());
  }
  componentWillUnmount() { (this.timers || []).forEach((t) => clearTimeout(t)); }
  actor0() {

class Mod3 extends DCLogic {

    else if (st.status === 'pending' && (st.rcpt || st.refund)) why = 'Pending, yet it already has a receipt or refund. Which field is the truth? Every reader has to guess.';
    else if (st.status === 'paid' && st.refund) why = 'Paid and refunded at once? The data contradicts itself, and every function reading it needs a defensive check.';
    else why = 'A required piece is missing for this status, and nothing in the program noticed.';
    const V = [
      { name: 'Pending', fields: 'no extra data', why: 'Pending carries nothing, so a pending order can’t accidentally hold a receipt.' },
      { name: 'Paid(receipt)', fields: 'must carry a receipt', why: 'You cannot build a Paid order without giving it a receipt. The compiler refuses.' },
      { name: 'Refunded(receipt, refund)', fields: 'must carry both', why: 'A refund always comes with the receipt it reverses. "Refunded but never paid" is not expressible.' }
    ];
    const variants = V.map((v, i) => ({ name: v.name, fields: v.fields, border: st.variant === i ? '#B0186E' : '#E4E0D8', pick: () => this.setState({ variant: i }) }));

    // railway
    const steps = [['Parse request', 'BadRequest'], ['Validate amount', 'InvalidAmount'], ['Reserve stock', 'OutOfStock'], ['Charge card', 'Declined'], ['Send receipt', 'MailNotSent']];

      const glm = st.glm.concat([{ label: m.label, note: m.ok ? 'compiles and is handled' : 'compile error: expected CartMessage, got ' + m.why.replace('a ', '').replace(', not a CartMessage', ''), bg: m.ok ? '#E2F4E7' : '#FFF1C2' }]).slice(-5);

      looseStatus, rcptLabel: st.rcpt ? 'set' : 'empty', refLabel: st.refund ? 'set' : 'empty',
      rcptCls: st.rcpt ? 'btn on' : 'btn', refCls: st.refund ? 'btn on' : 'btn',
      toggleRcpt: () => this.setState({ rcpt: !st.rcpt }), toggleRef: () => this.setState({ refund: !st.refund }),
      looseVerdict: ok ? 'Accepted. Valid by luck.' : 'Accepted. A bug waiting to happen.', looseWhy: why,
      looseBg: ok ? '#F1EEE8' : '#FDECEA', looseFg: ok ? '#17162B' : '#7A1A12',
      variants, typedWhy: V[st.variant].why,
      disputed: st.disputed, dispLabel: st.disputed ? 'Remove Disputed' : 'Add the Disputed state', dispCls: st.disputed ? 'btn on' : 'btn pri',
      toggleDisp: () => this.setState({ disputed: !st.disputed }),
      rail, okPct, errStart, outcome, railNote, outBg: firstFail === -1 ? '#E2F4E7' : '#FDECEA', outFg: firstFail === -1 ? '#0E4D25' : '#7A1A12',
      clearFails: () => this.setState({ fails: {} }),

    }, {});
  }


  tourDefs() {
    return {
      types: { reset: () => this.setState({ status: 'refunded', rcpt: false, refund: true, variant: 1, disputed: false }), steps: [
        { t: 'The same order modelled two ways: a loose record of optional fields on the left, a custom type with one variant per state on the right.' },
        { t: 'Loose: status "paid" with a receipt and no refund. It makes sense, but only by luck. Nothing enforced it.', a: () => this.setState({ status: 'paid', rcpt: true, refund: false }) },
        { t: 'Now "refunded" with no receipt: refunded but never paid. The program accepts it happily. That’s a bug waiting for production.', a: () => this.setState({ status: 'refunded', rcpt: false, refund: true }) },
        { t: 'Typed: choose the Refunded variant. It must carry both a receipt and a refund, so the nonsense order simply can’t be built.', a: ($) => $().variants[2].pick() },

        { t: 'Even a plain "hello" is caught before the program ever runs.', a: ($) => $().msgBtns[3].send() },

    const APPS = [['Checkout', ['saga', 'grind', 'http_gun']], ['Financial recovery', ['saga', 'grind', 'http_gun']], ['Webhooks', ['grind', 'http_gun']], ['Invoice extractor', ['grind', 'http_gun', 'llm_wire', 'blueprint']], ['Tool hub', ['relay', 'fabric', 'llm_wire', 'blueprint', 'http_gun']], ['Secure MCP', ['relay', 'hellhound', 'grind', 'blueprint', 'http_gun']], ['SSO portal', ['hellhound', 'http_gun']], ['Email portal', ['correio']], ['Support desk', ['fabric', 'saga', 'llm_wire', 'hellhound', 'blueprint', 'http_gun']], ['Research agent', ['grind', 'fabric', 'saga', 'llm_wire', 'http_gun', 'blueprint']], ['Session replay', ['retrace']], ['Clinic registration', ['decisions', 'llm_wire', 'grind', 'blueprint', 'http_gun']], ['Payout desk', ['fabric', 'decisions', 'relay', 'saga', 'grind', 'hellhound', 'blueprint']], ['Moderation desk', ['decisions', 'blueprint']]];

    APPS.forEach((a) => {
      const inter = a[1].filter((x) => mine.indexOf(x) >= 0).length;
      const uni = new Set(a[1].concat(mine)).size;

    });
    const yoursList = ['policy and permissions', 'resource lifetimes: pools, clients, supervisors'];
    if (nd.model || nd.agent) yoursList.push('conversation history and retry budgets');
    if (nd.agent) yoursList.push('each tool’s domain logic');
    if (nd.durable) yoursList.push('the PostgreSQL pool and who runs migrations');
    if (nd.email) yoursList.push('templates');
    if (nd.auth) yoursList.push('accounts and session cookies');
    if (nd.human) yoursList.push('who holds which decision set');
    if (nd.replay) yoursList.push('what is safe to record');
    if (nd.steps || nd.http) yoursList.push('idempotency keys for external effects');

    return Object.assign({
      systems, sys, chips, flow, cur, total: N, atStart: cur <= 1, atEnd: cur >= N,
      back: () => this.setState({ cur: Math.max(1, cur - 1) }), fwd: () => this.setState({ cur: Math.min(N, cur + 1) }), playAll,
      patterns, reqs, picked, noneYet: !picked.length, applies, noPattern: !applies.length,
      nearest: best ? best[0] : 'Pick a requirement', nearestWhy: best ? 'Shares the most packages with your design. Open it in the Oversight repository.' : '',

  }

      E(1, 0, 'grind.job.acknowledged', 'grind', 'The attempt’s result is stored in the job row. The order fails cleanly, with nothing left half-done.')
    ];
    return common.concat(this.state.tr === 'ok' ? ok : fail);
  }
  extraVals() {
    const T = this.trace(), N = T.length, cur = Math.max(1, Math.min(this.state.tcur, N)), e = T[cur - 1];
    const LIBC = { grind: ['#FDF0DC', '#6B3404', 'amber', 'Grind'], saga: ['#FCE7F3', '#5E0B3A', 'pink', 'Saga'], http_gun: ['#E0E9FD', '#163A8A', 'blue', 'HTTP Gun'] };
    const short = (x) => { const p = x.name.split(' · '); if (x.by === 'http_gun') return 'lifecycle: ' + p[1]; return p[1] ? p[0] + ' (' + p[1].split('_')[0] + ')' : p[0]; };
    const events = T.map((x) => ({ f: x.f, t: x.t, kind: x.t == null ? 'note' : undefined, label: short(x), color: LIBC[x.by][2] }));
    const parts = e.name.split(' · ');
    const list = '[' + parts[0].split('.').map((p) => '"' + p + '"').join(', ') + ']' + (parts[1] ? '  ' + parts[1] : '');
    const lanes = ['your app', 'Grind', 'Saga', 'HTTP Gun', 'providers'];
    return {
      trOpts: [['ok', 'Everything succeeds'], ['fail', 'Shipping fails']].map((o) => ({ label: o[1], cls: this.state.tr === o[0] ? 'on' : '', pick: () => { clearInterval(this.tanim); this.setState({ tr: o[0], tcur: 1 }); } })),
      traceChart: GD.msc({ id: 'tr', lanes, events, upto: cur, laneGap: 165, row: 26, numbers: true, active: e.t == null ? e.f : e.t, aria: 'Trace of the durable checkout as telemetry events, event ' + cur + ' of ' + N }),
      trEv: { list, by: LIBC[e.by][3], bg: LIBC[e.by][0], fg: LIBC[e.by][1], meaning: e.meaning, fields: e.fields, hasFields: !!e.fields },
      trCur: cur, trTotal: N, trAtStart: cur <= 1, trAtEnd: cur >= N,
      trBack: () => this.setState({ tcur: Math.max(1, cur - 1) }), trNext: () => this.setState({ tcur: Math.min(N, cur + 1) }),
      trSet: (ev) => this.setState({ tcur: Number(ev && ev.target ? ev.target.value : ev) }),
      trPlay: () => {
        clearInterval(this.tanim);
        if (!GD.motion()) { this.setState({ tcur: N }); return; }
        this.setState({ tcur: 1 });
        this.tanim = setInterval(() => { const n = this.trace().length; if (this.state.tcur >= n) { clearInterval(this.tanim); return; } this.setState({ tcur: this.state.tcur + 1 }); }, 800);

    };
  }
  tourDefs() {
    return {
      systems: { reset: () => { clearInterval(this.anim); this.setState({ sys: 0, cur: 1 }); }, steps: [
        { t: 'Ten real applications from the Oversight repository. Lit chips are the packages each one uses.' },
        { t: 'Checkout: watch which package does what as the steps play. Grind keeps it durable; Saga keeps it ordered and undoable.', a: ($) => { $().systems[0].pick(); $().playAll(); }, ms: 9800 },
        { t: 'Payout desk: an agent proposes, a decision point decides, a saga pays. Fabric never moves money itself.', a: ($) => { $().systems[8].pick(); $().playAll(); }, ms: 7600 },
        { t: 'Pick any system and step through it yourself.' }
      ] },

        { t: 'Tick what a system must do; get the packages, the patterns and the nearest example. This one needs durable, undoable steps: Grind plus Saga, like checkout.' },
        { t: 'A different system: typed answers from an LLM, run in the background. LLM Wire, JSON Blueprint, Grind: the invoice extractor.', a: () => this.setState({ need: { model: true, durable: true } }) },
        { t: 'Add an agent with tools and a human approver: Fabric hands risky calls to a Decisions point.', a: () => this.setState({ need: { model: true, durable: true, agent: true, human: true } }) },

        { t: 'Zoom into the charge: HTTP Gun reports milestones. gun_call_returned does not prove the provider got the request: the MaybeSent gap from module 4.', a: () => this.setState({ tcur: 8 }) },
        { t: 'Meanwhile Grind’s renewer keeps the lease alive, then the response settles and the step is checkpointed.', a: () => this.setState({ tcur: 12 }) },
        { t: 'The run completes and Grind stores the outcome in the job row: the durable truth.', a: () => this.setState({ tcur: 16 }) },
        { t: 'Same trace when shipping fails: the undo events run newest first, then the run stops compensated. Scrub through it yourself.', a: () => this.setState({ tr: 'fail', tcur: 18 }) }
      ] }
    };
  }

class Mod11 extends DCLogic {
  constructor(props) { super(props); this.state = { answers: {}, strat: 'det', priv: true, pos: 6, q: '', gtag: 'all' }; }
  renderVals() {
    const st = this.state;

    const EV = [['open cart', 'msg'], ['add Book', 'msg'], ['add Mug', 'msg'], ['coupon SAVE10', 'ext'], ['type email', 'msg'], ['checkout', 'msg']];

    // ---------- glossary ----------
    const G = [
      ['Process', 'BEAM', 'A tiny isolated unit of work with its own memory. Millions can run at once.'],
      ['Mailbox', 'BEAM', 'The queue of messages a process handles one at a time.'],
      ['Link', 'BEAM', 'Ties two processes’ fates: when one dies, the other gets an exit signal.'],
      ['Monitor', 'BEAM', 'A one-way watch: you get a message when the other process goes down.'],
      ['Preemptive scheduling', 'BEAM', 'Every process gets a small work budget, then must step aside.'],
      ['Actor', 'OTP', 'A process with private state that handles messages in a loop (gen_server).'],
      ['Supervisor', 'OTP', 'Starts children and restarts them by strategy; escalates if restarts happen too often.'],
      ['Restart strategy', 'OTP', 'One for one, one for all, or rest for one: which children restart together.'],
      ['Subject', 'Gleam', 'A typed address: it only accepts messages of one type.'],
      ['Result', 'Gleam', 'Ok(value) or Error(reason): failure as an ordinary value.'],
      ['Custom type', 'Gleam', 'A type with variants, each carrying exactly the data its case needs.'],
      ['Codec', 'JSON Blueprint', 'One definition that encodes, strictly decodes and publishes a JSON Schema.'],
      ['Forwarder', 'Sinal', 'A bounded process that runs observers off the hot path; drops and counts when full.'],
      ['Destination policy', 'HTTP Gun', 'Rules on where a client may connect, checked against resolved addresses.'],
      ['Cassette', 'HTTP Gun', 'A recorded set of exchanges replayed offline in tests, with secrets redacted.'],
      ['NotSent', 'principle', 'Provably never left your machine. Safe to retry.'],
      ['MaybeSent', 'principle', 'May have reached the other side. Retry only with an idempotency key, or reconcile.'],
      ['Idempotency key', 'principle', 'A stable id for an effect so a repeat is recognised and not done twice.'],
      ['Reconcile', 'principle', 'Ask an authoritative source what really happened, then record it.'],
      ['Prepare', 'LLM Wire', 'Validate and encode a request with no network, before spending tokens.'],
      ['Verifier', 'Relay', 'Your function that decides whether a bearer token is admitted.'],
      ['Token custody', 'Hellhound', 'Keeping a user’s tokens safe and refreshed under an opaque session.'],
      ['Sender', 'Correio', 'An injected function that delivers a message: SMTP, Postmark or a test capture.'],

    const q = (st.q || '').toLowerCase();
