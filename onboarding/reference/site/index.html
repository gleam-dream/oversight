<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gleam-dream onboarding: from the BEAM to real systems</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>

body{margin:0;background:#FAF8F4}
a{color:#B0186E}a:hover{color:#7E0F4E}
.pg{font-family:Inter,system-ui,sans-serif;color:#17162B;background:#FAF8F4;line-height:1.55;font-size:17px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3,h4{font-family:'Space Grotesk',Inter,sans-serif;margin:0;line-height:1.15;letter-spacing:-0.01em}
p{margin:0}
.top{border-bottom:1px solid #E4E0D8;background:#FAF8F4}
.topin{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px 0}
.brand{font:600 15px 'JetBrains Mono',monospace;color:#17162B;text-decoration:none}
.meta{font:500 13px 'JetBrains Mono',monospace;color:#5B5970}
.k{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:#B0186E}
.mono{font-family:'JetBrains Mono',monospace}
.muted{color:#5B5970}
.sec{padding-bottom:72px}
.h2{font-size:34px;margin:10px 0 12px}
.lead{font-size:18px;color:#5B5970;max-width:760px}
.card{background:#fff;border:1px solid #E4E0D8;border-radius:16px;padding:24px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:28px}
.cards h3{font-size:20px;margin:12px 0 6px}
.cards p{font-size:15px;color:#5B5970}
.ico{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.lab{background:#fff;border:1px solid #E4E0D8;border-radius:24px;padding:32px;margin-top:28px;box-shadow:0 1px 0 #E4E0D8}
.labh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:20px}
.tag{display:inline-block;font:600 11px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;border-radius:999px;background:#FCE7F3;color:#8A1056}
.chip{display:inline-block;font:600 12px 'JetBrains Mono',monospace;padding:4px 10px;border-radius:999px}
.btn{font:600 14px Inter,sans-serif;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #17162B;background:#fff;color:#17162B;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn:hover{background:#F1EEE8}
.btn.pri{background:#17162B;color:#fff}.btn.pri:hover{background:#2E2C4F}
.btn.on{background:#17162B;color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.warn{border-color:#B42318;color:#B42318}.btn.warn:hover{background:#FDECEA}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;padding:4px;border-radius:999px;background:#F1EEE8}
.seg button{font:600 13px Inter,sans-serif;min-height:40px;padding:0 14px;border-radius:999px;border:0;background:transparent;color:#17162B;cursor:pointer}
.seg button.on{background:#17162B;color:#fff}
.log{background:#17162B;color:#E8E6F5;border-radius:14px;padding:16px 18px;font:13px/1.6 'JetBrains Mono',monospace;min-height:120px}
.log .l{padding:2px 0;border-bottom:1px solid #2E2C4F}
.key{background:#17162B;color:#fff;border-radius:20px;padding:32px 36px;margin-top:28px}
.key .k{color:#F9A8D4}
.key p{font:600 22px/1.4 'Space Grotesk',sans-serif;margin-top:10px;max-width:880px}
.note{background:#F1EEE8;border-radius:14px;padding:16px 20px;font-size:15px}
.split{display:flex;flex-wrap:wrap;gap:24px}
.split>*{flex:1 1 360px;min-width:0}
.pill{display:inline-flex;align-items:center;gap:6px;font:600 12px 'JetBrains Mono',monospace;padding:6px 10px;border-radius:8px;background:#F1EEE8}
.q{background:#fff;border:1px solid #E4E0D8;border-radius:16px;padding:24px;margin-top:16px}
.q h4{font-size:19px;margin-bottom:14px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;font:500 15px Inter,sans-serif;min-height:48px;padding:10px 16px;border-radius:12px;border:1px solid #E4E0D8;background:#FAF8F4;color:#17162B;cursor:pointer}
.opt:hover{border-color:#17162B}
.opt.right{background:#E2F4E7;border-color:#15803D;color:#0E4D25;font-weight:600}
.opt.wrong{background:#FDECEA;border-color:#B42318;color:#7A1A12}
.opt.dim{opacity:.55}
.fb{margin-top:14px;font-size:15px;padding:12px 16px;border-radius:12px;background:#F1EEE8}
.foot{border-top:1px solid #E4E0D8;padding:40px 0 64px}
.navc{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:#17162B;background:#fff;border:1px solid #E4E0D8;border-radius:16px;padding:20px 24px;flex:1 1 300px}
.navc:hover{border-color:#17162B;color:#17162B}
.box{border-radius:14px;padding:14px 16px;border:1px solid #E4E0D8;background:#fff}
.arrow{font:600 18px 'JetBrains Mono',monospace;color:#8A8698;display:flex;align-items:center;justify-content:center}

.btnl{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:999px;font:600 15px Inter,sans-serif;text-decoration:none;border:1px solid #17162B}
.btnl.pri{background:#17162B;color:#fff}.btnl.pri:hover{background:#2E2C4F;color:#fff}
.btnl.sec{background:#fff;color:#17162B}.btnl.sec:hover{background:#F1EEE8;color:#17162B}
.layer{display:flex;align-items:center;gap:16px;width:100%;min-height:64px;padding:12px 20px;border-radius:14px;border:2px solid transparent;cursor:pointer;text-align:left;font:inherit;transition:transform .15s}
.layer:hover{transform:translateX(4px)}
.layer.on{border-color:#17162B;box-shadow:0 6px 0 #17162B}
.ln{font:600 12px 'JetBrains Mono',monospace;opacity:.8;width:28px}
.lt{font:600 19px 'Space Grotesk',sans-serif}
.ls{font-size:14px;opacity:.85}
.mod{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:#17162B;background:#fff;border:1px solid #E4E0D8;border-radius:16px;padding:20px;transition:border-color .15s,transform .15s}
.mod:hover{border-color:#17162B;color:#17162B;transform:translateY(-2px)}
.mnum{font:600 12px 'JetBrains Mono',monospace;color:#5B5970;display:flex;justify-content:space-between}
.mt{font:600 19px 'Space Grotesk',sans-serif}
.dark{background:#17162B;color:#fff;border-radius:20px;padding:40px}
html{scroll-behavior:smooth}
.appbar{position:sticky;top:0;z-index:20;background:rgba(250,248,244,.94);backdrop-filter:blur(8px);border-bottom:1px solid #E4E0D8}
.appin{max-width:1120px;margin:0 auto;padding:10px 24px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.prog{display:flex;align-items:center;gap:10px;flex:1 1 220px;max-width:360px}
.progbar{flex:1;height:8px;border-radius:99px;background:#E4E0D8;overflow:hidden}
.progbar span{display:block;height:8px;background:#B0186E;border-radius:99px;transition:width .3s}
.drawer{max-width:1120px;margin:0 auto;padding:4px 24px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.drawer a{display:flex;gap:10px;align-items:center;justify-content:space-between;text-decoration:none;color:#17162B;background:#fff;border:1px solid #E4E0D8;border-radius:12px;padding:10px 14px;min-height:48px;font-size:15px}
.drawer a:hover{border-color:#17162B;color:#17162B}
.drawer a.cur{border:2px solid #17162B}
.drawer .dn{font:600 12px 'JetBrains Mono',monospace;color:#5B5970;white-space:nowrap}
.drawer .ok{color:#15803D}
.donebtn{font:600 15px Inter,sans-serif;min-height:52px;padding:0 22px;border-radius:999px;border:2px solid #15803D;background:#fff;color:#0E4D25;cursor:pointer}
.donebtn:hover{background:#F1FAF3}
.donebtn.on{background:#15803D;color:#fff}
#view:focus{outline:none}
.drawer[hidden]{display:none}
input[type=range]{accent-color:#B0186E;min-height:28px}
body.still *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
.tourbar{background:#17162B;color:#fff;border-radius:14px;padding:12px 14px 10px;margin-bottom:16px}
.tourbar.freebar{background:#F1FAF3;color:#0E4D25;border:1px solid #B9E2C4;padding:8px 12px}
.tb-top{display:flex;gap:12px;align-items:center}
.tourn{font:600 12px 'JetBrains Mono',monospace;color:#F9A8D4;white-space:nowrap;min-width:34px}
.tourtext{font-size:15px;line-height:1.45;margin:0;flex:1;min-height:44px;display:flex;align-items:center}
.tb-ctl{display:flex;gap:6px;align-items:center}
.tbi{width:40px;height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.tbi:hover{background:rgba(255,255,255,.14)}
.tbi:disabled{opacity:.3;cursor:default}
.tbn{height:40px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:#17162B;font:600 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.tbn:hover{background:#FCE7F3}
.tb-foot{display:flex;gap:12px;align-items:center;margin-top:8px}
.tdots{display:flex;gap:4px;flex:1}
.tdots span{flex:1;height:4px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden}
.tdots i{display:block;height:100%;width:0;background:#F9A8D4;border-radius:9px;transition:width .35s ease}
@keyframes tfA{from{width:0}to{width:100%}}
@keyframes tfB{from{width:0}to{width:100%}}
.tblink{background:none;border:0;color:#C9C6E0;font:500 12px Inter,sans-serif;cursor:pointer;padding:4px 0;text-decoration:underline;white-space:nowrap}
.tblink:hover{color:#fff}
.freebar .btn{color:#0E4D25;border-color:#15803D}
.freebar .btn:hover{background:#E2F4E7}
.lab.touring .labh p{display:none}
.lab.touring .labh{margin-bottom:12px}
.lab.touring .labh h2{font-size:22px!important;margin-top:6px!important}
.lab.touring{scroll-margin-top:70px;padding:20px 24px}
.lab.touring .tour-hide{display:none!important}
.lab.touring .log{min-height:0!important;max-height:140px;overflow:hidden}
.lab.touring .syslist button{min-height:38px!important;padding:6px 12px!important}
.lab.touring .note{padding:10px 14px;font-size:14px}
.lab[data-rt-z="60"]>:not(.tourbar){zoom:0.60}
.lab[data-rt-z="65"]>:not(.tourbar){zoom:0.65}
.lab[data-rt-z="70"]>:not(.tourbar){zoom:0.70}
.lab[data-rt-z="75"]>:not(.tourbar){zoom:0.75}
.lab[data-rt-z="80"]>:not(.tourbar){zoom:0.80}
.lab[data-rt-z="85"]>:not(.tourbar){zoom:0.85}
.lab[data-rt-z="90"]>:not(.tourbar){zoom:0.90}
.lab[data-rt-z="95"]>:not(.tourbar){zoom:0.95}
@keyframes mscin{from{opacity:0}to{opacity:1}}
@keyframes mscdraw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.msc-new{animation:mscin .45s ease-out}
.msc-new path.solid{stroke-dasharray:1;animation:mscdraw .55s ease-out}
.live svg text{font-family:Inter,system-ui,sans-serif}
.lab.touring button:not(.tb),.lab.touring input,.lab.touring select,.lab.touring label{pointer-events:none}
.lab.touring .labh~*,.lab.touring>.split,.lab.touring>div:not(.tourbar):not(.labh){cursor:default}
.msc-h{font:600 13px Inter,sans-serif;fill:#17162B}
.msc-l{font:500 12px 'JetBrains Mono',monospace}
@keyframes pulse{0%{opacity:1}50%{opacity:.35}100%{opacity:1}}
.pulse{animation:pulse 1s infinite}
@media (max-width:640px){.tb-top{flex-wrap:wrap}.tourtext{flex-basis:100%;order:3}.lab{padding:18px}.tourbar{padding:14px}.key{padding:24px}}
</style>
</head>
<body>
<div class="pg">
<header class="appbar">
<div class="appin">
<a class="brand" href="#start">gleam-dream / onboarding</a>
<div class="prog" aria-live="polite"><div class="progbar" aria-hidden="true"><span id="pbar" style="width:0%"></span></div><span class="meta" id="ptext">0 of 11 done</span></div>
<div class="row" style="gap:8px"><button type="button" class="btn sm" id="motionBtn" aria-pressed="true" title="Turn animations and auto-play on or off">Motion: on</button><button type="button" class="btn sm" id="menuBtn" aria-expanded="false" aria-controls="drawer">All modules</button></div>
</div>
<nav id="drawer" class="drawer" aria-label="Modules" hidden></nav>
</header>
<main id="view" tabindex="-1"></main>
<footer id="foot" class="wrap foot"></footer>
</div>
<template id="t-start">


<header class="wrap" style="padding-top:80px;padding-bottom:56px">
<div class="k">Onboarding for new developers</div>
<h1 style="font-size:clamp(40px,6vw,76px);margin-top:16px;max-width:900px">From the BEAM to real systems</h1>
<p style="font-size:21px;max-width:760px;margin:24px 0 0" class="muted">A guided path through the runtime, the language and the gleam-dream libraries. You'll leave with a mental model you can navigate by: what each layer gives you, what each package owns, and how they snap together into real services.</p>
<div style="display:flex;flex-wrap:wrap;gap:12px;margin-top:32px">
<a class="btnl pri" href="#beam">Start with the BEAM →</a>
<a class="btnl sec" href="#atlas">Jump to the package atlas</a>
</div>
<div style="display:flex;flex-wrap:wrap;gap:24px;margin-top:40px" class="muted">
<span><b style="color:#17162B">No code required.</b> Concepts, pictures and playgrounds.</span>
<span><b style="color:#17162B">Self-paced.</b> Every module stands alone.</span>
<span><b style="color:#17162B">Progress saved.</b> Mark modules done as you go.</span>
</div>
</header>

<section class="wrap" style="padding-bottom:72px">
<div class="lab {{T.stack.cls}}" data-tid="stack" style="padding:32px;margin-top:0"><sc-if value="{{T.stack.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">
<div class="tb-top"><span class="tourn">{{T.stack.n}}/{{T.stack.total}}</span><p class="tourtext" aria-live="polite">{{T.stack.text}}</p>
<div class="tb-ctl">
<button type="button" class="tbi tb" onClick="{{T.stack.prev}}" disabled="{{T.stack.atStart}}" aria-label="Previous step"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<sc-if value="{{T.stack.canPlay}}"><button type="button" class="tbi tb" onClick="{{T.stack.toggle}}" aria-label="{{T.stack.playLabel}}"><sc-if value="{{T.stack.paused}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5 L12.5 7 L3 12.5 Z" fill="currentColor"></path></svg></sc-if><sc-if value="{{T.stack.playing}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"></rect><rect x="8.3" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"></rect></svg></sc-if></button></sc-if>
<button type="button" class="tbn tb" onClick="{{T.stack.next}}">{{T.stack.nextLabel}}</button>
</div></div>
<div class="tb-foot"><div class="tdots" aria-hidden="true"><sc-for list="{{T.stack.dots}}" as="d"><span><i style="width:{{d.w}};animation:{{d.anim}}"></i></span></sc-for></div><button type="button" class="tblink tb" onClick="{{T.stack.skip}}">Skip tour · unlock controls</button></div>
</div></sc-if>
<sc-if value="{{T.stack.free}}"><div class="tourbar freebar row" style="gap:12px;justify-content:space-between"><span style="font-size:14px"><b>Free play.</b> Everything is unlocked: try your own experiments.</span><button type="button" class="btn sm tb" onClick="{{T.stack.replay}}">Replay the guided tour</button></div></sc-if>
<div style="display:flex;flex-wrap:wrap;gap:32px">
<div style="flex:1 1 420px;min-width:0">
<div class="k">Playground · the whole picture</div>
<h2 style="font-size:32px;margin:10px 0 8px">Six layers, one stack</h2>
<p class="muted" style="margin:0 0 20px">Everything you'll learn sits on one of these layers. Each layer leans on the one below it. Click a layer to see what it gives you.</p>
<div style="display:flex;flex-direction:column;gap:8px">
<sc-for list="{{layers}}" as="l" hint-placeholder-count="6">
<button type="button" class="{{l.cls}}" style="background:{{l.bg}};color:{{l.fg}}" onClick="{{l.pick}}" aria-pressed="{{l.on}}">
<span class="ln">{{l.n}}</span>
<span style="display:flex;flex-direction:column"><span class="lt">{{l.name}}</span><span class="ls">{{l.tag}}</span></span>
</button>
</sc-for>
</div>
</div>
<div style="flex:1 1 380px;min-width:0;display:flex">
<div style="flex:1;border-radius:16px;padding:28px;background:{{sel.bg}};color:{{sel.fg}};display:flex;flex-direction:column;gap:16px">
<div style="font:600 12px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.85">Layer {{sel.n}}</div>
<h3 style="font-size:34px">{{sel.name}}</h3>
<p style="margin:0;font-size:18px">{{sel.summary}}</p>
<div>
<div style="font:600 12px 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:8px">It gives you</div>
<sc-for list="{{sel.gives}}" as="g" hint-placeholder-count="3">
<div style="display:flex;gap:10px;margin-bottom:6px"><span aria-hidden="true">→</span><span>{{g}}</span></div>
</sc-for>
</div>
<div style="margin-top:auto;padding-top:12px;border-top:1px solid currentColor;opacity:.95">
<div style="font-size:14px">{{sel.where}}</div>
<a href="{{sel.href}}" style="color:inherit;font-weight:700">{{sel.cta}} →</a>
</div>
</div>
</div>
</div>
</div>
</section>

<section class="wrap" style="padding-bottom:72px">
<div class="k">How every module works</div>
<h2 style="font-size:32px;margin:10px 0 24px">Read a little, play a lot, carry one idea forward</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px">
<div class="card"><div class="chip" style="background:#EBEAFD;color:#2B2862">1 · Read</div><h3 style="font-size:20px;margin:14px 0 6px">Short concepts</h3><p class="muted" style="margin:0;font-size:15px">A handful of cards, each a single idea in plain words.</p></div>
<div class="card"><div class="chip" style="background:#FCE7F3;color:#8A1056">2 · Play</div><h3 style="font-size:20px;margin:14px 0 6px">Playgrounds</h3><p class="muted" style="margin:0;font-size:15px">Crash processes, inject failures, flip policies. Watch what happens.</p></div>
<div class="card"><div class="chip" style="background:#FDF0DC;color:#8A3F06">3 · Tick off</div><h3 style="font-size:20px;margin:14px 0 6px">Mark it done</h3><p class="muted" style="margin:0;font-size:15px">When a module clicks, mark it done. Your progress stays in this browser.</p></div>
<div class="card"><div class="chip" style="background:#DDF3F0;color:#0B5A54">4 · Carry</div><h3 style="font-size:20px;margin:14px 0 6px">One key idea</h3><p class="muted" style="margin:0;font-size:15px">The sentence to remember when you open a real repository.</p></div>
</div>
</section>

<section class="wrap" style="padding-bottom:72px">
<div class="k">Your path · about 3½ hours</div>
<h2 style="font-size:32px;margin:10px 0 8px">Four phases, eleven modules</h2>
<p class="muted" style="margin:0 0 32px;max-width:720px">Go in order the first time. Each phase builds the vocabulary the next one uses. Times assume you try every playground.</p>

<sc-for list="{{phases}}" as="p" hint-placeholder-count="4">
<div style="margin-bottom:40px">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:16px">
<span class="chip" style="background:{{p.cbg}};color:#fff">{{p.label}}</span>
<h3 style="font-size:24px">{{p.title}}</h3>
<span class="meta">{{p.time}}</span>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px">
<sc-for list="{{p.mods}}" as="m" hint-placeholder-count="3">
<a class="mod" href="{{m.href}}">
<span class="mnum"><span>Module {{m.n}}</span><span>{{m.doneLabel}}{{m.min}} min</span></span>
<span class="mt">{{m.title}}</span>
<span class="muted" style="font-size:15px">{{m.blurb}}</span>
<span style="font-size:13px;font-weight:600;color:#B0186E;margin-top:auto">Playground: {{m.play}}</span>
</a>
</sc-for>
</div>
</div>
</sc-for>
</section>

<section class="wrap" style="padding-bottom:96px">
<div class="dark">
<div class="k" style="color:#F9A8D4">The one-sentence version</div>
<p style="font:600 clamp(24px,3vw,34px)/1.3 'Space Grotesk',sans-serif;margin:14px 0 0;max-width:900px">The BEAM gives you isolated processes, OTP turns failure into restarts, Gleam adds types, and gleam-dream adds twelve focused libraries that each own one mechanism while your application keeps every decision.</p>
<p style="margin:20px 0 0;color:#C9C6E0;max-width:760px">By module 11 that sentence should feel obvious. If any part of it doesn't yet, that's the module to start with.</p>
<div style="margin-top:28px"><a class="btnl" style="background:#fff;color:#17162B;border-color:#fff" href="#beam">Begin →</a></div>
</div>
</section>
</template>
<template id="t-beam"><header class="wrap" style="padding-top:72px;padding-bottom:56px">
<div class="k">Module 1 · Phase 1: the runtime</div>
<h1 style="font-size:clamp(38px,5.5vw,64px);margin-top:14px;max-width:900px">The BEAM: a machine made of tiny computers</h1>
<p class="lead" style="margin-top:20px;font-size:20px">Erlang, Elixir and Gleam all run on the BEAM, a virtual machine built at Ericsson for telephone switches that had to stay up for years. Its big idea: build software out of many small, isolated processes that only talk by sending messages.</p>
<div class="card" style="margin-top:32px;max-width:760px">
<div class="k" style="color:#5B5970">By the end you can explain</div>
<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
<span>→ what a BEAM process is, and why you can run millions of them</span>
<span>→ why one process crashing doesn't corrupt the others</span>
<span>→ how messages, mailboxes, links and schedulers fit together</span>
</div>
</div>
</header>

<section class="wrap sec">
<div class="k">Read · six words to know</div>
<h2 class="h2">The vocabulary of the BEAM</h2>
<p class="lead">Six ideas cover almost everything. Every library you'll meet later is made of these.</p>
<div class="cards">
<div class="card"><div class="ico" style="background:#EBEAFD"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2862" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle></svg></div><h3>Process</h3><p>Not an OS thread. A tiny unit of work with its own memory and garbage collector, a few KB in size. Starting one takes microseconds, so programs run thousands or millions.</p></div>
<div class="card"><div class="ico" style="background:#EBEAFD"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2862" stroke-width="2" aria-hidden="true"><path d="M4 7h16v10H4z"></path><path d="M4 7l8 6 8-6"></path></svg></div><h3>Message</h3><p>A value copied from one process to another. Sending is asynchronous: you send and move on. Nothing is shared, so there are no locks to get wrong.</p></div>
<div class="card"><div class="ico" style="background:#EBEAFD"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2862" stroke-width="2" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h9"></path></svg></div><h3>Mailbox</h3><p>Every process has a queue of incoming messages. It handles them one at a time, so its own state is never touched by two things at once.</p></div>
<div class="card"><div class="ico" style="background:#EBEAFD"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2862" stroke-width="2" aria-hidden="true"><path d="M4 18V8M10 18V4M16 18v-7M22 18H2"></path></svg></div><h3>Scheduler</h3><p>One per CPU core. Each process gets a small budget of work, then must step aside. No single process can starve the rest.</p></div>
<div class="card"><div class="ico" style="background:#EBEAFD"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2862" stroke-width="2" aria-hidden="true"><circle cx="7" cy="12" r="4"></circle><circle cx="17" cy="12" r="4"></circle></svg></div><h3>Link &amp; monitor</h3><p>Ways to hear that another process died. A link ties two fates together. A monitor just delivers a "it went down" message.</p></div>
<div class="card"><div class="ico" style="background:#EBEAFD"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B2862" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="8" height="7" rx="1"></rect><rect x="13" y="13" width="8" height="7" rx="1"></rect><path d="M11 8h4v5"></path></svg></div><h3>Node</h3><p>One running BEAM. Nodes can connect and message across machines. Most gleam-dream libraries deliberately stay on one node and use a database for anything shared.</p></div>
</div>
</section>

<section class="wrap sec">
<div class="lab {{T.proc.cls}}" data-tid="proc"><sc-if value="{{T.proc.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">

<button type="button" class="tbn tb" onClick="{{T.proc.next}}">{{T.proc.nextLabel}}</button>
</div></div>

</div></sc-if>
<sc-if value="{{T.proc.free}}"><div class="tourbar freebar row" style="gap:12px;justify-content:space-between"><span style="font-size:14px"><b>Free play.</b> Everything is unlocked: try your own experiments.</span><button type="button" class="btn sm tb" onClick="{{T.proc.replay}}">Replay the guided tour</button></div></sc-if>
<div class="labh">
<div><span class="tag">Playground</span><h2 style="font-size:28px;margin-top:10px">Process playground</h2>
<p class="muted" style="margin-top:6px;max-width:640px">Send messages, let processes handle them, then crash one. Watch what survives. Try linking two processes before you crash one of them.</p></div>
<div class="row"><button type="button" class="btn" onClick="{{spawn}}">+ Start a process</button><button type="button" class="btn sm" onClick="{{reset}}">Reset</button></div>
</div>

<div class="split" style="gap:16px;align-items:flex-start">
<div style="flex:2 1 520px">
<div class="row" style="margin-bottom:14px;gap:16px">
<div><div class="meta" style="margin-bottom:6px">From</div><div class="seg"><sc-for list="{{fromOpts}}" as="o" hint-placeholder-count="5"><button type="button" class="{{o.cls}}" onClick="{{o.pick}}">{{o.name}}</button></sc-for></div></div>
<div><div class="meta" style="margin-bottom:6px">To</div><div class="seg"><sc-for list="{{toOpts}}" as="o" hint-placeholder-count="5"><button type="button" class="{{o.cls}}" onClick="{{o.pick}}">{{o.name}}</button></sc-for></div></div>
<button type="button" class="btn pri" onClick="{{send}}" style="align-self:flex-end">Send "{{nextMsg}}" →</button>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
<sc-for list="{{procs}}" as="p" hint-placeholder-count="5">
<div style="border-radius:16px;padding:14px;border:2px solid {{p.border}};background:{{p.bg}};display:flex;flex-direction:column;gap:10px;min-height:150px">
<div style="display:flex;justify-content:space-between;align-items:center"><b class="mono" style="font-size:15px">{{p.name}}</b><span class="chip" style="background:{{p.sbg}};color:{{p.sfg}}">{{p.status}}</span></div>
<div class="meta" style="font-size:12px">{{p.linkNote}}</div>
<div style="font-size:12px" class="muted">Mailbox ({{p.count}})</div>
<div style="display:flex;flex-wrap:wrap;gap:4px;min-height:28px">
<sc-for list="{{p.mail}}" as="m" hint-placeholder-count="2"><span class="chip" style="background:#EBEAFD;color:#2B2862">{{m}}</span></sc-for>
</div>
<div class="meta" style="font-size:12px">handled: {{p.handled}}</div>
<div class="row" style="gap:6px;margin-top:auto">
<sc-if value="{{p.alive}}" hint-placeholder-val="{{true}}"><button type="button" class="btn sm" onClick="{{p.receive}}" disabled="{{p.empty}}">Handle one</button><button type="button" class="btn sm warn" onClick="{{p.crash}}">Crash</button></sc-if>
<sc-if value="{{p.dead}}" hint-placeholder-val="{{false}}"><button type="button" class="btn sm" onClick="{{p.restart}}">Start again</button></sc-if>
</div>
</div>
</sc-for>
</div>
<div class="row" style="margin-top:14px">
<button type="button" class="{{linkBtnCls}}" onClick="{{toggleLink}}">{{linkLabel}}</button>
<span class="muted tour-hide" style="font-size:14px">A link ties two processes' fates: if one dies, the other gets an exit signal and dies too.</span>
</div>
</div>
<div style="flex:1 1 300px">
<div class="meta" style="margin-bottom:6px">What just happened</div>
<div class="log" style="min-height:300px">
<sc-for list="{{log}}" as="l" hint-placeholder-count="4"><div class="l">{{l}}</div></sc-for>
</div>
<p class="muted" style="font-size:13px;margin-top:10px">{{procCount}} processes running here. A real BEAM node runs millions on a laptop.</p>
</div>
</div>
</div>
<div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between;margin-bottom:8px"><div><div class="k">The same story as a timeline</div><p class="muted" style="font-size:14px;margin-top:4px">A message sequence chart: each column is a process, time flows down. It redraws live as you play.</p></div><span class="meta">{{chartCount}}</span></div>
<div style="overflow-x:auto"><svg viewBox="0 0 {{procChart.w}} {{procChart.h}}" width="100%" style="min-width:540px;max-width:{{procChart.w}}px;display:block;margin:0 auto" role="img" aria-label="{{procChart.aria}}">
<defs>
<marker id="mk-{{procChart.id}}-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#17162B"></path></marker>
<marker id="mk-{{procChart.id}}-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B42318"></path></marker>
<marker id="mk-{{procChart.id}}-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803D"></path></marker>
<marker id="mk-{{procChart.id}}-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B0186E"></path></marker>
<marker id="mk-{{procChart.id}}-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1D4ED8"></path></marker>
<marker id="mk-{{procChart.id}}-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"></path></marker>
<marker id="mk-{{procChart.id}}-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A8698"></path></marker>
</defs>
<sc-for list="{{procChart.lanes}}" as="l"><rect x="{{l.bx}}" y="6" width="140" height="30" rx="8" fill="{{l.active}}"></rect><text x="{{l.x}}" y="26" text-anchor="middle" class="msc-h" style="fill:{{l.fg}}">{{l.label}}</text><line x1="{{l.x}}" y1="38" x2="{{l.x}}" y2="{{procChart.lineEnd}}" stroke="#D5D1C8" stroke-width="2" stroke-dasharray="4 5"></line></sc-for>
<sc-for list="{{procChart.arrows}}" as="a"><g opacity="{{a.op}}" class="{{a.cls}}"><path class="{{a.pc}}" pathLength="{{a.pl}}" d="{{a.d}}" stroke="{{a.color}}" stroke-width="{{a.sw}}" fill="none" stroke-dasharray="{{a.dash}}" marker-end="{{a.mark}}"></path><sc-if value="{{a.lost}}"><text x="{{a.cx}}" y="{{a.cy}}" fill="#B42318" style="font:700 18px Inter,sans-serif" dy="6">⚡</text></sc-if><text x="{{a.lx}}" y="{{a.ly}}" text-anchor="{{a.anchor}}" class="msc-l" fill="{{a.color}}">{{a.label}}</text><text x="{{a.nx}}" y="{{a.ny}}" class="msc-l" fill="#8A8698">{{a.num}}</text></g></sc-for>
</svg></div>
</div>
<div class="note" style="margin-top:16px"><b>Notice:</b> crashing a process never touches anyone else's memory. The only way failure spreads is one you chose on purpose: a link. That makes failure <b>local and visible</b>, which is exactly what OTP builds on in the next module.</div>
</section>

<section class="wrap sec">
<div class="k">Read · fairness</div>
<h2 class="h2">Why one runaway loop can't freeze the system</h2>
<p class="lead">Most runtimes trust code to give the CPU back. The BEAM doesn't. Each process gets a small work budget (counted in "reductions"), then the scheduler moves on. That's why a BEAM service stays responsive under load.</p>
<div class="lab {{T.sched.cls}}" data-tid="sched"><sc-if value="{{T.sched.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">
<div class="tb-top"><span class="tourn">{{T.sched.n}}/{{T.sched.total}}</span><p class="tourtext" aria-live="polite">{{T.sched.text}}</p>
<div class="tb-ctl">
<button type="button" class="tbi tb" onClick="{{T.sched.prev}}" disabled="{{T.sched.atStart}}" aria-label="Previous step"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<sc-if value="{{T.sched.canPlay}}"><button type="button" class="tbi tb" onClick="{{T.sched.toggle}}" aria-label="{{T.sched.playLabel}}"><sc-if value="{{T.sched.paused}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5 L12.5 7 L3 12.5 Z" fill="currentColor"></path></svg></sc-if><sc-if value="{{T.sched.playing}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"></rect><rect x="8.3" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"></rect></svg></sc-if></button></sc-if>
<button type="button" class="tbn tb" onClick="{{T.sched.next}}">{{T.sched.nextLabel}}</button>
</div></div>
<div class="tb-foot"><div class="tdots" aria-hidden="true"><sc-for list="{{T.sched.dots}}" as="d"><span><i style="width:{{d.w}};animation:{{d.anim}}"></i></span></sc-for></div><button type="button" class="tblink tb" onClick="{{T.sched.skip}}">Skip tour · unlock controls</button></div>
</div></sc-if>
<sc-if value="{{T.sched.free}}"><div class="tourbar freebar row" style="gap:12px;justify-content:space-between"><span style="font-size:14px"><b>Free play.</b> Everything is unlocked: try your own experiments.</span><button type="button" class="btn sm tb" onClick="{{T.sched.replay}}">Replay the guided tour</button></div></sc-if>
<div class="labh">
<div><span class="tag">Playground</span><h2 style="font-size:28px;margin-top:10px">Two cores, five processes</h2>
<p class="muted" style="margin-top:6px;max-width:640px">Each square is one time slice on a core. Add a greedy process that never stops working, then switch between scheduling styles.</p></div>
</div>
<div class="row" style="gap:16px;margin-bottom:20px">
<div class="seg"><sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button type="button" class="{{m.cls}}" onClick="{{m.pick}}">{{m.label}}</button></sc-for></div>
<button type="button" class="{{greedyCls}}" onClick="{{toggleGreedy}}">{{greedyLabel}}</button>
</div>

<span class="meta" style="width:64px">{{lane.name}}</span>
<div style="display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:4px;flex:1">
<sc-for list="{{lane.slots}}" as="s" hint-placeholder-count="16"><div style="height:44px;border-radius:8px;background:{{s.bg}};color:{{s.fg}};display:flex;align-items:center;justify-content:center;font:600 14px 'JetBrains Mono',monospace">{{s.p}}</div></sc-for>
</div>
</div>
</sc-for>

<div class="note" style="margin-top:16px">{{schedNote}}</div>
</div>
</section>

<section class="wrap sec">
<div class="k">Read · the BEAM in one picture</div>
<h2 class="h2">What you now know, from the bottom up</h2>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:24px">
<div class="box" style="background:#2B2862;color:#fff;border:0"><div class="meta" style="color:#C9C6E0">1</div><b>Cores</b><p style="font-size:14px;color:#C9C6E0;margin-top:4px">One scheduler per core shares time fairly.</p></div>
<div class="box" style="background:#3E3A86;color:#fff;border:0"><div class="meta" style="color:#D9D6F2">2</div><b>Processes</b><p style="font-size:14px;color:#D9D6F2;margin-top:4px">Isolated memory, cheap to start, cheap to kill.</p></div>
<div class="box" style="background:#5651A8;color:#fff;border:0"><div class="meta" style="color:#E6E4F8">3</div><b>Messages</b><p style="font-size:14px;color:#E6E4F8;margin-top:4px">Copied values, queued in mailboxes, handled one at a time.</p></div>
<div class="box" style="background:#DCD9FF;color:#241F6B;border:0"><div class="meta">4</div><b>Links &amp; monitors</b><p style="font-size:14px;margin-top:4px">Failure becomes a signal another process can act on. Next module: OTP.</p></div>
</div>
<div class="key"><div class="k">Carry this forward</div><p>On the BEAM you don't try to prevent every failure. You contain it. A process is the unit of concurrency, of state and of failure.</p></div>
</section>

</template>
<template id="t-otp"><header class="wrap" style="padding-top:72px;padding-bottom:56px">
<div class="k">Module 2 · Phase 1: the runtime</div>
<h1 style="font-size:clamp(38px,5.5vw,64px);margin-top:14px;max-width:900px">OTP: turning failure into a restart</h1>
<p class="lead" style="margin-top:20px;font-size:20px">OTP is the toolkit that ships with Erlang: a set of proven patterns for processes that hold state, watch each other and restart cleanly. Gleam uses it through the <span class="mono">gleam_otp</span> and <span class="mono">gleam_erlang</span> packages, and every gleam-dream library is built on it.</p>
<div class="card" style="margin-top:32px;max-width:760px">
<div class="k" style="color:#5B5970">By the end you can explain</div>
<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
<span>→ what an actor is, and why it needs no locks</span>
<span>→ how a supervisor decides what to restart, and when it gives up</span>
<span>→ where each gleam-dream library plugs into your application</span>
</div>
</div>
</header>

<section class="wrap sec">
<div class="k">Read · the building patterns</div>
<h2 class="h2">Four shapes you'll see everywhere</h2>
<p class="lead">OTP calls these "behaviours". You'll rarely write them from scratch, but every library in this course uses them, so it pays to recognise them.</p>
<div class="cards">
<div class="card"><span class="chip" style="background:#DCD9FF;color:#241F6B">actor</span><h3>Actor</h3><p>A process with private state and a loop: take a message, compute the new state, maybe reply, repeat. Erlang calls it a gen_server.</p></div>
<div class="card"><span class="chip" style="background:#DCD9FF;color:#241F6B">call · send</span><h3>Call or send</h3><p>"Send" delivers a message and moves on. "Call" sends and waits for a reply, always with a timeout, because the other side might be dead.</p></div>
<div class="card"><span class="chip" style="background:#DCD9FF;color:#241F6B">supervisor</span><h3>Supervisor</h3><p>A process whose only job is to start children in order and restart them when they crash, following a strategy you choose.</p></div>
<div class="card"><span class="chip" style="background:#DCD9FF;color:#241F6B">application</span><h3>Application</h3><p>The top of the tree. It starts the root supervisor and stops everything, in reverse order, when the program shuts down.</p></div>
</div>
</section>

<section class="wrap sec">
<div class="lab {{T.actor.cls}}" data-tid="actor"><sc-if value="{{T.actor.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">
<div class="tb-top"><span class="tourn">{{T.actor.n}}/{{T.actor.total}}</span><p class="tourtext" aria-live="polite">{{T.actor.text}}</p>
<div class="tb-ctl">
<button type="button" class="tbi tb" onClick="{{T.actor.prev}}" disabled="{{T.actor.atStart}}" aria-label="Previous step"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<sc-if value="{{T.actor.canPlay}}"><button type="button" class="tbi tb" onClick="{{T.actor.toggle}}" aria-label="{{T.actor.playLabel}}"><sc-if value="{{T.actor.paused}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5 L12.5 7 L3 12.5 Z" fill="currentColor"></path></svg></sc-if><sc-if value="{{T.actor.playing}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"></rect><rect x="8.3" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"></rect></svg></sc-if></button></sc-if>
<button type="button" class="tbn tb" onClick="{{T.actor.next}}">{{T.actor.nextLabel}}</button>
</div></div>
<div class="tb-foot"><div class="tdots" aria-hidden="true"><sc-for list="{{T.actor.dots}}" as="d"><span><i style="width:{{d.w}};animation:{{d.anim}}"></i></span></sc-for></div><button type="button" class="tblink tb" onClick="{{T.actor.skip}}">Skip tour · unlock controls</button></div>
</div></sc-if>
<sc-if value="{{T.actor.free}}"><div class="tourbar freebar row" style="gap:12px;justify-content:space-between"><span style="font-size:14px"><b>Free play.</b> Everything is unlocked: try your own experiments.</span><button type="button" class="btn sm tb" onClick="{{T.actor.replay}}">Replay the guided tour</button></div></sc-if>
<div class="labh">
<div><span class="tag">Playground</span><h2 style="font-size:28px;margin-top:10px">Inside an actor</h2>
<p class="muted" style="margin-top:6px;max-width:660px">A shopping-cart actor. Messages queue up in its mailbox and it handles them strictly one at a time. Step through and watch the state change.</p></div>
<div class="row"><button type="button" class="btn" onClick="{{burst}}">Two requests at the same instant</button><button type="button" class="btn sm" onClick="{{resetActor}}">Reset</button></div>
</div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:stretch">

<template id="t-gleam"><header class="wrap" style="padding-top:72px;padding-bottom:56px">
<div class="k">Module 3 · Phase 1: the runtime</div>
<h1 style="font-size:clamp(38px,5.5vw,64px);margin-top:14px;max-width:900px">Gleam: types on the BEAM</h1>
<p class="lead" style="margin-top:20px;font-size:20px">Gleam is a friendly, statically typed language that compiles to Erlang (and to JavaScript). You keep everything the BEAM and OTP give you, and the compiler catches whole classes of mistakes before the code ever runs. Every gleam-dream library is written in Gleam 1.18 or later and targets Erlang.</p>
<div class="card" style="margin-top:32px;max-width:760px">
<div class="k" style="color:#5B5970">By the end you can explain</div>
<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
<span>→ how Gleam models data so impossible states can't even be built</span>
<span>→ why errors are ordinary values, and what that means for library APIs</span>
<span>→ how typed messages make actors safer than plain Erlang</span>
</div>
</div>
</header>

<section class="wrap sec">
<div class="k">Read · six ideas</div>
<h2 class="h2">What Gleam adds on top of the BEAM</h2>
<div class="cards">
<div class="card"><span class="chip" style="background:#F9D7F0;color:#4A1340">custom types</span><h3>One type, several shapes</h3><p>A type can have variants, each carrying exactly the data that case needs. "Paid" holds a receipt. "Pending" holds nothing.</p></div>
<div class="card"><span class="chip" style="background:#F9D7F0;color:#4A1340">pattern matching</span><h3>Every case handled</h3><p>When you branch on a type, the compiler checks you covered every variant. Add a new one and it shows you every place to update.</p></div>
<div class="card"><span class="chip" style="background:#F9D7F0;color:#4A1340">Result</span><h3>Errors are values</h3><p>A function that can fail returns either Ok(value) or Error(reason). No hidden exceptions: failure is written in the type.</p></div>
<div class="card"><span class="chip" style="background:#F9D7F0;color:#4A1340">Option</span><h3>No null</h3><p>"Maybe there's a value" is explicit: Some(value) or None. You can't forget to check, because the compiler won't let you.</p></div>
<div class="card"><span class="chip" style="background:#F9D7F0;color:#4A1340">immutability</span><h3>Values never change</h3><p>Updating means making a new value. That fits actors perfectly: the next state is simply the value the handler returns.</p></div>
<div class="card"><span class="chip" style="background:#F9D7F0;color:#4A1340">interop</span><h3>The whole BEAM is yours</h3><p>Gleam calls Erlang and Elixir libraries directly. gleam-dream wraps a few proven ones, like Gun and telemetry, behind typed APIs.</p></div>
</div>
</section>

<section class="wrap sec">
<div class="k">Read · typed messages</div>
<h2 class="h2">Mailboxes with a type</h2>
<p class="lead">In Erlang any process can send anything to anyone. In Gleam you send to a <b>Subject</b>: an address that only accepts one message type. Wrong messages become compile errors instead of mystery crashes.</p>
<div class="lab {{T.msgs.cls}}" data-tid="msgs"><sc-if value="{{T.msgs.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">

</div>
</section>

<section class="wrap sec">
<div class="k">Read · Gleam meets the rest of the BEAM</div>
<h2 class="h2">Typed wrappers over proven engines</h2>
<p class="lead">Several gleam-dream libraries wrap battle-tested Erlang code behind a typed surface. You get the reliability of the original and the safety of Gleam.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:24px">
<div class="box"><span class="chip" style="background:#DDF3F0;color:#0B4A45">HTTP Gun</span><p style="margin-top:8px;font-size:15px">wraps <b>Gun</b>, Erlang's HTTP/1.1 and HTTP/2 client</p></div>
<div class="box"><span class="chip" style="background:#DDF3F0;color:#0B4A45">Sinal</span><p style="margin-top:8px;font-size:15px">wraps <b>:telemetry</b>, the event registry Erlang and Elixir libraries share</p></div>
<div class="box"><span class="chip" style="background:#FDF0DC;color:#6B3404">Grind</span><p style="margin-top:8px;font-size:15px">uses <b>pog / pgo</b> for PostgreSQL connections</p></div>
<div class="box"><span class="chip" style="background:#EEE7FD;color:#3B1785">Correio</span><p style="margin-top:8px;font-size:15px">uses <b>gen_smtp</b> for SMTP delivery</p></div>
</div>
<div class="note" style="margin-top:16px"><b>One BEAM detail to remember:</b> atoms (the BEAM's named constants) are never garbage-collected. Sinal turns event names into atoms, so those names belong in source code, never built from user input. You'll see a few warnings like this: they're where the BEAM's rules show through the types.</div>
<div class="key"><div class="k">Carry this forward</div><p>Make the compiler your first reviewer: model states as types, return errors as values, and type your messages. gleam-dream APIs follow these rules all the way down.</p></div>
</section>

</template>
<template id="t-principles"><header class="wrap" style="padding-top:72px;padding-bottom:56px">
<div class="k">Module 4 · Phase 2: the mental model</div>
<h1 style="font-size:clamp(38px,5.5vw,64px);margin-top:14px;max-width:940px">How gleam-dream thinks</h1>
<p class="lead" style="margin-top:20px;font-size:20px">gleam-dream is a family of independent libraries, not a framework. They were designed by the same hands, so they share a handful of habits. Learn these seven once and every README will read like a variation on a theme.</p>
<div class="card" style="margin-top:32px;max-width:760px">
<div class="k" style="color:#5B5970">By the end you can</div>
<div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">
<span>→ say what a library owns and what your application owns</span>
<span>→ read "NotSent", "MaybeSent" and "Unknown" and know the safe next move</span>
<span>→ predict where a package puts limits, records and pure logic</span>
</div>
</div>
</header>

<section class="wrap sec">
<div class="k">Read · the seven habits</div>
<h2 class="h2">One attitude, seven habits</h2>
<p class="lead">Click a habit for the one-line version and where you'll meet it.</p>

<button type="button" onClick="{{h.pick}}" style="text-align:left;font:inherit;cursor:pointer;border-radius:16px;padding:20px;border:2px solid {{h.border}};background:{{h.bg}};color:{{h.fg}};display:flex;flex-direction:column;gap:6px;min-height:120px">
<span class="mono" style="font-size:13px;font-weight:600;opacity:.8">0{{h.n}}</span>
<b style="font:600 19px 'Space Grotesk',sans-serif">{{h.title}}</b>
<span style="font-size:14px;opacity:.9">{{h.short}}</span>
</button>
</sc-for>
</div>
<div class="card" style="margin-top:16px;padding:28px">
<div class="k">Habit {{habit.n}}</div>
<h3 style="font-size:26px;margin:8px 0 10px">{{habit.title}}</h3>
<p style="font-size:17px;max-width:860px">{{habit.long}}</p>
<div class="row" style="margin-top:14px"><span class="meta">Seen in</span><sc-for list="{{habit.seen}}" as="s" hint-placeholder-count="3"><span class="pill">{{s}}</span></sc-for></div>
</div>
</section>

<section class="wrap sec">
<div class="k">Habit 2 · ownership</div>
<h2 class="h2">Who owns what?</h2>
<p class="lead">Every README has a sentence that starts "Your application owns…". Sort these twelve jobs. Guess first, then read the reason.</p>
<div class="lab {{T.sorter.cls}}" data-tid="sorter"><sc-if value="{{T.sorter.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">
<div class="tb-top"><span class="tourn">{{T.sorter.n}}/{{T.sorter.total}}</span><p class="tourtext" aria-live="polite">{{T.sorter.text}}</p>
<div class="tb-ctl">
<button type="button" class="tbi tb" onClick="{{T.sorter.prev}}" disabled="{{T.sorter.atStart}}" aria-label="Previous step"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
<sc-if value="{{T.sorter.canPlay}}"><button type="button" class="tbi tb" onClick="{{T.sorter.toggle}}" aria-label="{{T.sorter.playLabel}}"><sc-if value="{{T.sorter.paused}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5 L12.5 7 L3 12.5 Z" fill="currentColor"></path></svg></sc-if><sc-if value="{{T.sorter.playing}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"></rect><rect x="8.3" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"></rect></svg></sc-if></button></sc-if>
<button type="button" class="tbn tb" onClick="{{T.sorter.next}}">{{T.sorter.nextLabel}}</button>
</div></div>
<div class="tb-foot"><div class="tdots" aria-hidden="true"><sc-for list="{{T.sorter.dots}}" as="d"><span><i style="width:{{d.w}};animation:{{d.anim}}"></i></span></sc-for></div><button type="button" class="tblink tb" onClick="{{T.sorter.skip}}">Skip tour · unlock controls</button></div>
</div></sc-if>
<sc-if value="{{T.sorter.free}}"><div class="tourbar freebar row" style="gap:12px;justify-content:space-between"><span style="font-size:14px"><b>Free play.</b> Everything is unlocked: try your own experiments.</span><button type="button" class="btn sm tb" onClick="{{T.sorter.replay}}">Replay the guided tour</button></div></sc-if>
<div class="labh"><div><span class="tag">Playground</span><h2 style="font-size:28px;margin-top:10px">Library or your app?</h2></div><div class="row"><span class="mono" style="font-weight:600">{{sortScore}}</span><button type="button" class="btn sm" onClick="{{resetSort}}">Reset</button></div></div>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px">
<sc-for list="{{sortItems}}" as="s" hint-placeholder-count="6">
<div style="border-radius:14px;padding:16px;border:1px solid {{s.border}};background:{{s.bg}};display:flex;flex-direction:column;gap:10px">
<b style="font-size:15px">{{s.job}}</b>
<div class="row" style="gap:8px"><button type="button" class="{{s.libCls}}" onClick="{{s.pickLib}}">Library</button><button type="button" class="{{s.appCls}}" onClick="{{s.pickApp}}">Your app</button></div>

</div>
</sc-for>

<div class="note" style="margin-top:16px"><b>The pattern:</b> libraries own <i>mechanisms</i> (pooling, leasing, encoding, refreshing, recording). Your application owns <i>decisions and lifetimes</i> (policy, retries, accounts, pools, templates, exporters).</div>
</div>
</section>

<section class="wrap sec">
<div class="k">Habit 5 · honest uncertainty</div>
<h2 class="h2">"Did it happen?" is a real answer</h2>
<p class="lead">When a call to the outside world breaks, the honest answer is often "maybe". gleam-dream never hides that. It tells you what it can prove, so you can choose a safe next move instead of guessing.</p>
<div class="lab {{T.happen.cls}}" data-tid="happen"><sc-if value="{{T.happen.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">

</div>
<div style="margin-top:20px;border-top:1px solid #E4E0D8;padding-top:20px">

<span style="font-size:15px;max-width:520px">{{retryResult}}</span>

<sc-for list="{{happenChart.arrows}}" as="a"><g opacity="{{a.op}}" class="{{a.cls}}"><path class="{{a.pc}}" pathLength="{{a.pl}}" d="{{a.d}}" stroke="{{a.color}}" stroke-width="{{a.sw}}" fill="none" stroke-dasharray="{{a.dash}}" marker-end="{{a.mark}}"></path><sc-if value="{{a.lost}}"><text x="{{a.cx}}" y="{{a.cy}}" fill="#B42318" style="font:700 18px Inter,sans-serif" dy="6">⚡</text></sc-if><text x="{{a.lx}}" y="{{a.ly}}" text-anchor="{{a.anchor}}" class="msc-l" fill="{{a.color}}">{{a.label}}</text><text x="{{a.nx}}" y="{{a.ny}}" class="msc-l" fill="#8A8698">{{a.num}}</text></g></sc-for>

<div class="box"><b>Correio</b> <span class="muted" style="font-size:14px">Accepted · NotSent · Rejected · OutcomeUnknown</span></div>
<div class="box"><b>Grind</b> <span class="muted" style="font-size:14px">an Uncertain job waits for an audited resolution</span></div>
<div class="box"><b>Saga</b> <span class="muted" style="font-size:14px">an unknown effect can Hold for reconciliation</span></div>

</div>
</div>

<section class="wrap sec">
<div class="k">Habit 5, continued · retrying wisely</div>
<h2 class="h2">When everyone retries at once</h2>
<p class="lead">Safe retries are only half the story. If a service blips and every client retries on the same schedule, the retries arrive together and knock it over again: the <b>thundering herd</b>. gleam-dream never retries behind your back, so the retry schedule is yours. LLM Wire's retry advice even passes on the provider's Retry-After.</p>
<div class="lab {{T.herd.cls}}" data-tid="herd"><sc-if value="{{T.herd.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">
<div class="tb-top"><span class="tourn">{{T.herd.n}}/{{T.herd.total}}</span><p class="tourtext" aria-live="polite">{{T.herd.text}}</p>
<div class="tb-ctl">

</div></div>

</div></sc-if>
<sc-if value="{{T.herd.free}}"><div class="tourbar freebar row" style="gap:12px;justify-content:space-between"><span style="font-size:14px"><b>Free play.</b> Everything is unlocked: try your own experiments.</span><button type="button" class="btn sm tb" onClick="{{T.herd.replay}}">Replay the guided tour</button></div></sc-if>
<div class="labh"><div><span class="tag">Simulation</span><h2 style="font-size:28px;margin-top:10px">80 clients, one 1-second outage</h2><p class="muted" style="margin-top:6px;max-width:700px">The service is down for the first second, then serves at most 6 requests per 100 ms, and fewer when swamped, because overload eats capacity. Each bar is 100 ms: green requests were served, red were turned away and will retry. Pick a retry schedule.</p></div>

<div class="seg" style="margin-bottom:18px"><sc-for list="{{herdOpts}}" as="o" hint-placeholder-count="4"><button type="button" class="{{o.cls}}" onClick="{{o.pick}}">{{o.label}}</button></sc-for></div>
<div style="overflow-x:auto"><svg viewBox="0 0 800 220" width="100%" style="min-width:600px;display:block" role="img" aria-label="{{herdAria}}">

</div>

<section class="wrap sec">
<div class="k">Habit 3 · typed boundaries</div>
<h2 class="h2">Define once, use everywhere</h2>
<p class="lead">A recurring move: you write one typed definition, and the library derives every use from it. Producer and consumer can never drift apart, because they share the same value.</p>
<div class="lab {{T.defs.cls}}" data-tid="defs"><sc-if value="{{T.defs.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">
<div class="tb-top"><span class="tourn">{{T.defs.n}}/{{T.defs.total}}</span><p class="tourtext" aria-live="polite">{{T.defs.text}}</p>
<div class="tb-ctl">
<button type="button" class="tbi tb" onClick="{{T.defs.prev}}" disabled="{{T.defs.atStart}}" aria-label="Previous step"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>

<div class="tb-foot"><div class="tdots" aria-hidden="true"><sc-for list="{{T.defs.dots}}" as="d"><span><i style="width:{{d.w}};animation:{{d.anim}}"></i></span></sc-for></div><button type="button" class="tblink tb" onClick="{{T.defs.skip}}">Skip tour · unlock controls</button></div>
</div></sc-if>
<sc-if value="{{T.defs.free}}"><div class="tourbar freebar row" style="gap:12px;justify-content:space-between"><span style="font-size:14px"><b>Free play.</b> Everything is unlocked: try your own experiments.</span><button type="button" class="btn sm tb" onClick="{{T.defs.replay}}">Replay the guided tour</button></div></sc-if>

<section class="wrap sec">
<div class="k">Habit 4 · bounded by default</div>
<h2 class="h2">Every wait has an end</h2>
<p class="lead">Queues have capacities, bodies have size limits, calls have deadlines. Here are LLM Wire's three default timeouts for a model call. Make the provider misbehave and see which bound trips first.</p>

</div></sc-if>
<sc-if value="{{T.bounds.free}}"><div class="tourbar freebar row" style="gap:12px;justify-content:space-between"><span style="font-size:14px"><b>Free play.</b> Everything is unlocked: try your own experiments.</span><button type="button" class="btn sm tb" onClick="{{T.bounds.replay}}">Replay the guided tour</button></div></sc-if>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px">

</div>
<div style="margin-top:20px;border-radius:14px;padding:18px 20px;background:{{boundBg}};color:{{boundFg}}"><b style="font-size:18px">{{boundTitle}}</b><p style="font-size:15px;margin-top:4px">{{boundWhy}}</p></div>
<div class="row" style="margin-top:16px;gap:8px"><span class="meta">Other bounds you'll meet</span><span class="pill">Sinal forwarder · 1,024 events</span><span class="pill">HTTP Gun · body &amp; batch limits</span><span class="pill">JSON Blueprint · byte limit on untrusted text</span><span class="pill">Grind · per-node queue concurrency</span><span class="pill">Saga · per-run concurrency, deadlines</span><span class="pill">Fabric · turns, timeouts, token budgets</span></div>
</div>
</section>

<section class="wrap sec">
<div class="k">Habits 6 &amp; 7 · records and pure cores</div>
<h2 class="h2">Truth lives in records; logic lives in pure functions</h2>
<div class="split" style="margin-top:24px">
<div class="card">
<h3 style="font-size:22px;margin-bottom:12px">Durable rows are the truth</h3>
<div style="display:flex;flex-direction:column;gap:10px">
<div class="box" style="background:#E2F4E7;border-color:#B9E2C4"><b>Source of truth</b><p style="font-size:14px;margin-top:4px">Rows in your database: Grind job outcomes, Saga checkpoints, Fabric run records, Decisions entries. Decide business questions from these.</p></div>
<div class="box" style="background:#F1EEE8"><b>Signals</b><p style="font-size:14px;margin-top:4px">Sinal events are best effort. Under load a forwarder drops and counts. Use them for dashboards and alerts, never to decide whether money moved.</p></div>
</div>
</div>
<div class="card">
<h3 style="font-size:22px;margin-bottom:12px">Pure core, thin process shell</h3>
<div style="display:flex;flex-direction:column;gap:8px;align-items:stretch">
<div class="box" style="text-align:center"><b>Events in</b> <span class="muted">requests, replies, timeouts</span></div>
<div class="arrow" aria-hidden="true">↓</div>
<div class="box" style="text-align:center;background:#FCE7F3;border-color:#F3C6E6"><b>Pure function</b><br><span style="font-size:14px">(state, event) → new state + effects to perform</span></div>
<div class="arrow" aria-hidden="true">↓</div>
<div class="box" style="text-align:center;background:#DCD9FF;border-color:#C6C1FA"><b>Thin OTP process</b> <span style="font-size:14px">performs the effects</span></div>
</div>
<p class="muted" style="font-size:14px;margin-top:12px">Relay's runtime actor runs a pure reducer. Fabric pairs a pure controller with a thin runner. Decisions' core is pure, with optional OTP and PostgreSQL packages around it. The logic can be tested and replayed without starting a single process.</p>
</div>
</div>
<div class="key"><div class="k">Carry this forward</div><p>Libraries own mechanisms; your app owns decisions and lifetimes. Everything is typed, bounded and honest about what it can prove, and the durable record, not the log, is the truth.</p></div>
</section>

<section class="wrap sec">
<div class="k">Read · what the map tells you</div>
<h2 class="h2">Three things to notice</h2>
<div class="cards">
<div class="card"><span class="chip" style="background:#DDF3F0;color:#0B4A45">Sinal</span><h3>Observability is built in</h3><p>{{sinalCount}} of the 11 other libraries emit Sinal events. Attach observers once and you can see inside HTTP calls, jobs, workflows and agents alike.</p></div>
<div class="card"><span class="chip" style="background:#DDF3F0;color:#0B4A45">JSON Blueprint</span><h3>Data crossing a boundary is typed</h3><p>Wherever data meets a model, a protocol or a stored record (LLM Wire, Relay, Fabric, Decisions), JSON Blueprint codecs describe its shape and generate the schema.</p></div>
<div class="card"><span class="chip" style="background:#E0E9FD;color:#163A8A">HTTP Gun</span><h3>One door to the network</h3><p>LLM Wire, Relay, Hellhound and Fabric all reach the network through an HTTP Gun client that <i>your</i> application starts. One place to set limits and destination rules.</p></div>
</div>
<div class="note" style="margin-top:16px"><b>Storage is opt-in.</b> Most libraries run in memory out of the box. PostgreSQL support comes as separate adapter packages (Saga, Fabric, Hellhound, Correio and Decisions each have one), and they borrow your connection pool. Grind is the exception: it is built on PostgreSQL.</div>
<div class="key"><div class="k">Carry this forward</div><p>Find a package by the job it does and the layer it sits on. Lower layers are shared plumbing; higher layers coordinate work, and your application sits on top of them all.</p></div>
</section>

<template id="t-foundations"><header class="wrap" style="padding-top:72px;padding-bottom:48px">
<div class="k">Module 6 · Phase 3: the building blocks</div>
<h1 style="font-size:clamp(38px,5.5vw,64px);margin-top:14px;max-width:900px">Foundations: observe, shape, reach</h1>
<p class="lead" style="margin-top:20px;font-size:20px">Three small libraries carry most of the ecosystem on their backs. <b>Sinal</b> lets everything report what it's doing. <b>JSON Blueprint</b> describes the shape of data at every boundary. <b>HTTP Gun</b> is the single, bounded door to the network.</p>
<div class="row" style="margin-top:28px;gap:10px">
<a class="pill" href="#sinal" style="text-decoration:none;color:#0B4A45;background:#DDF3F0">Sinal · telemetry</a>
<a class="pill" href="#blueprint" style="text-decoration:none;color:#0B4A45;background:#DDF3F0">JSON Blueprint · data shapes</a>
<a class="pill" href="#gun" style="text-decoration:none;color:#163A8A;background:#E0E9FD">HTTP Gun · the network</a>
</div>
</header>

<section class="wrap sec" id="sinal">
<div class="k">Sinal · typed telemetry</div>
<h2 class="h2">Report facts without slowing the work</h2>
<p class="lead">You define an event once, with typed fields. Code emits it; observers react to it. Underneath, it's the same :telemetry registry Erlang and Elixir libraries already share, so their handlers can listen too. Observers normally run inside the emitting process. If they're slow, route them through a bounded <b>forwarder</b>.</p>
<div class="lab {{T.sinal.cls}}" data-tid="sinal"><sc-if value="{{T.sinal.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">

</div></sc-if>
<sc-if value="{{T.sinal.free}}"><div class="tourbar freebar row" style="gap:12px;justify-content:space-between"><span style="font-size:14px"><b>Free play.</b> Everything is unlocked: try your own experiments.</span><button type="button" class="btn sm tb" onClick="{{T.sinal.replay}}">Replay the guided tour</button></div></sc-if>

<div class="note" style="margin-top:16px;background:#FFF7E0"><b>Two rules from the README:</b> event names become permanent BEAM atoms, so write them in source code and never build them from input. And forwarding is best effort: never use a telemetry event as proof that something happened. That's what durable records are for.</div>

<section class="wrap sec" id="blueprint">
<div class="k">JSON Blueprint · data shapes</div>
<h2 class="h2">One codec, three faces</h2>
<p class="lead">A codec describes a Gleam type's JSON shape: which fields exist, which are optional, which values are allowed. From that one definition you get an <b>encoder</b>, a strict <b>decoder</b> and a <b>JSON Schema</b>. LLM Wire, Relay, Fabric and Decisions all accept codecs, which is why the schema a model sees always matches the decoder that checks its answer.</p>

<div class="tb-ctl">

<sc-if value="{{T.codec.canPlay}}"><button type="button" class="tbi tb" onClick="{{T.codec.toggle}}" aria-label="{{T.codec.playLabel}}"><sc-if value="{{T.codec.paused}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5 L12.5 7 L3 12.5 Z" fill="currentColor"></path></svg></sc-if><sc-if value="{{T.codec.playing}}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"></rect><rect x="8.3" y="1.5" width="3.2" height="11" rx="1" fill="currentColor"></rect></svg></sc-if></button></sc-if>

</div></div>
<div class="tb-foot"><div class="tdots" aria-hidden="true"><sc-for list="{{T.codec.dots}}" as="d"><span><i style="width:{{d.w}};animation:{{d.anim}}"></i></span></sc-for></div><button type="button" class="tblink tb" onClick="{{T.codec.skip}}">Skip tour · unlock controls</button></div>
</div></sc-if>
<sc-if value="{{T.codec.free}}"><div class="tourbar freebar row" style="gap:12px;justify-content:space-between"><span style="font-size:14px"><b>Free play.</b> Everything is unlocked: try your own experiments.</span><button type="button" class="btn sm tb" onClick="{{T.codec.replay}}">Replay the guided tour</button></div></sc-if>
<div class="labh"><div><span class="tag">Playground</span><h2 style="font-size:28px;margin-top:10px">The User codec</h2><p class="muted" style="margin-top:6px">name (text) · age (whole number from 0 to 150) · email (optional) · role (admin or member)</p></div></div>

<sc-if value="{{faceEncode}}" hint-placeholder-val="{{false}}">

</div>
</sc-if>
<sc-if value="{{faceDecode}}" hint-placeholder-val="{{false}}">
<div class="meta" style="margin-bottom:8px">Pick some incoming JSON</div>

<p class="muted" style="font-size:15px;margin-top:12px">This is published as a standard Draft 2020-12 JSON Schema. Hand it to a model as the shape of a structured answer or a tool's arguments, and the same codec checks what comes back.</p>

<section class="wrap sec" id="gun">
<div class="k">HTTP Gun · the network</div>
<h2 class="h2">A client that tells the truth</h2>
<p class="lead">HTTP Gun moves bytes, enforces limits and reports exactly what happened. It deliberately doesn't interpret statuses, retry, follow redirects or speak protocols like SSE: those belong to adapters such as LLM Wire, or to your app. Click a part of the client to see its job.</p>
<div class="lab {{T.anatomy.cls}}" data-tid="anatomy"><sc-if value="{{T.anatomy.touring}}" hint-placeholder-val="{{true}}"><div class="tourbar" role="region" aria-label="Guided tour">

<section class="wrap sec" id="which">
<div class="k">Read · choosing a coordinator</div>
<h2 class="h2">Which one coordinates this work?</h2>
<p class="lead">Four packages coordinate work over time. They don't compete; each answers a different question, and real systems often stack two.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:24px">
<div class="card" style="background:#FFFBF4"><span class="chip" style="background:#FDF0DC;color:#6B3404">Grind</span><h3 style="font-size:20px;margin:10px 0 6px">"Do this one thing, durably."</h3><p class="muted" style="font-size:15px">One unit of work that must survive restarts, with retries and scheduling. Email, webhook delivery, a provider callback.</p></div>
<div class="card" style="background:#FFFBF4"><span class="chip" style="background:#FDF0DC;color:#6B3404">Saga</span><h3 style="font-size:20px;margin:10px 0 6px">"Do these steps, in order, or undo."</h3><p class="muted" style="font-size:15px">Known steps with dependencies, concurrency and compensation. Reserve, charge, ship.</p></div>
<div class="card" style="background:#FFF7FC"><span class="chip" style="background:#FCE7F3;color:#5E0B3A">Fabric</span><h3 style="font-size:20px;margin:10px 0 6px">"Let a model choose the next move."</h3><p class="muted" style="font-size:15px">An agent loop, or a graph that routes on typed results and waits for signals. Module 9.</p></div>
<div class="card" style="background:#FFF7FC"><span class="chip" style="background:#FCE7F3;color:#5E0B3A">Decisions</span><h3 style="font-size:20px;margin:10px 0 6px">"Should this output be released?"</h3><p class="muted" style="font-size:15px">One recommendation, a policy, maybe a person, and a release at most once. Module 9.</p></div>
</div>
<div class="card" style="margin-top:16px">
<h3 style="font-size:20px;margin-bottom:12px">The classic stack: a job drives a saga</h3>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:stretch">
<div class="box" style="background:#F6F4FF"><b>1 · Request</b><p style="font-size:14px;margin-top:4px">Insert the order and submit a Grind job in one transaction.</p></div>
<div class="box" style="background:#FDF0DC"><b>2 · Job runs</b><p style="font-size:14px;margin-top:4px">The handler drives a durable saga by a stable execution id.</p></div>
<div class="box" style="background:#FDF0DC"><b>3 · Saga checkpoints</b><p style="font-size:14px;margin-top:4px">Each completed step is saved; uncertain ones get a resolver.</p></div>
<div class="box" style="background:#E2F4E7"><b>4 · Crash? Resume.</b><p style="font-size:14px;margin-top:4px">Grind redelivers the job; the saga reconnects and continues.</p></div>
</div>
<p class="muted" style="font-size:14px;margin-top:12px">This is the checkout and financial-recovery examples in Oversight. The research agent adds Fabric in the middle.</p>
</div>
<div class="key"><div class="k">Carry this forward</div><p>Durable work is a record you can resume, not a process you hope survives. Grind keeps single jobs; Saga keeps dependent steps and their undo; both hold what they can't prove.</p></div>
</section>

<template id="t-agents"><header class="wrap" style="padding-top:72px;padding-bottom:48px">
<div class="k">Module 9 · Phase 3: the building blocks</div>
<h1 style="font-size:clamp(38px,5.5vw,64px);margin-top:14px;max-width:940px">Agents &amp; people in the loop</h1>
<p class="lead" style="margin-top:20px;font-size:20px">Models are great at proposing and unreliable at being trusted. <b>Fabric</b> runs bounded agents whose every action passes through your policy. <b>Decisions</b> turns "should this go out?" into a recorded decision point, where autonomy grows by publishing data rather than shipping code.</p>
<div class="row" style="margin-top:28px;gap:10px">
<a class="pill" href="#fabric" style="text-decoration:none;color:#5E0B3A;background:#FCE7F3">Fabric · bounded agents</a>

<section class="wrap sec" id="fabric">
<div class="k">Fabric · bounded agents</div>
<h2 class="h2">An agent is a model, tools, a policy and limits</h2>
<p class="lead">You build a checked agent from four things, then start runs in a <b>store</b>. The store keeps each run's record and supervises the runner doing the work. A handle only addresses a run: dropping it cancels nothing, and a run can be reopened by its id after a restart.</p>
<div class="cards">
<div class="card"><span class="chip" style="background:#FCE7F3;color:#5E0B3A">model</span><h3>Proposes</h3><p>An LLM Wire provider or any custom model function. It suggests the next tool calls or a final answer.</p></div>
<div class="card"><span class="chip" style="background:#FCE7F3;color:#5E0B3A">tools</span><h3>Act</h3><p>Typed tools with codecs. Each classifies its result: done, failed, or uncertain if it may have reached the world.</p></div>
<div class="card"><span class="chip" style="background:#FCE7F3;color:#5E0B3A">policy</span><h3>Decides</h3><p>Your function sees every proposed action and answers Allow, Deny, RequireApproval or HandOver.</p></div>
<div class="card"><span class="chip" style="background:#FCE7F3;color:#5E0B3A">limits</span><h3>Bound</h3><p>Max turns, model and tool timeouts, concurrent tool bodies, optional token and family budgets.</p></div>
</div>

<section class="wrap sec" id="decisions">
<div class="k">Decisions · decision points</div>
<h2 class="h2">Recommend, decide, release once, remember everything</h2>
<p class="lead">A <b>decision point</b> is a place where an output must not reach the world unchecked. A model (or a rule, or a person) recommends; a versioned policy either proceeds or asks a person; the final output is released at most once to a gated tool, inside your transaction. Every step is appended to a record, and that record is what you learn from.</p>
<div class="cards">
<div class="card"><span class="chip" style="background:#FCE7F3;color:#5E0B3A">point</span><h3>The declaration</h3><p>The output type and codec, and the facts a policy may read. No thresholds live here.</p></div>
<div class="card"><span class="chip" style="background:#FCE7F3;color:#5E0B3A">occurrence</span><h3>One case</h3><p>One recommendation about one subject, as append-only entries. Keyed, so a trigger delivered twice is one occurrence.</p></div>
<div class="card"><span class="chip" style="background:#FCE7F3;color:#5E0B3A">policy</span><h3>Versioned data</h3><p>Rules over the facts. Publishing a stricter or looser version changes behaviour without a deploy.</p></div>
<div class="card"><span class="chip" style="background:#FCE7F3;color:#5E0B3A">gated tool</span><h3>Released once</h3><p>The only path to the effect. It accepts nothing but a released output, at most once.</p></div>
</div>

<section class="wrap sec" id="together">
<div class="k">Read · Fabric + Decisions + Saga</div>
<h2 class="h2">The payout desk, in five moves</h2>
<p class="lead">The richest example in Oversight combines everything in this module. A marketplace pays its sellers, and nobody wants an agent moving money on its own say-so.</p>
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:24px">
<div class="box" style="background:#FCE7F3;border-color:#F3C6E6"><div class="meta">1 · Fabric</div><b>Investigate</b><p style="font-size:14px;margin-top:4px">A support agent reads the dispute and proposes propose_payout.</p></div>
<div class="box" style="background:#FCE7F3;border-color:#F3C6E6"><div class="meta">2 · Fabric policy</div><b>Hand over</b><p style="font-size:14px;margin-top:4px">The policy hands the call over. The run ends; nothing is paid.</p></div>
<div class="box" style="background:#FFF7FC;border-color:#F3C6E6"><div class="meta">3 · Decisions</div><b>Decide</b><p style="font-size:14px;margin-top:4px">The payout point applies a versioned policy: small won disputes proceed after an undo window; large ones need two from finance.</p></div>
<div class="box" style="background:#FDF0DC;border-color:#F3D9B1"><div class="meta">4 · Saga</div><b>Pay</b><p style="font-size:14px;margin-top:4px">The released payout runs as a saga with an idempotency key; Grind delivers the wake-ups.</p></div>
<div class="box" style="background:#E2F4E7;border-color:#B9E2C4"><div class="meta">5 · Fabric again</div><b>Tell the seller</b><p style="font-size:14px;margin-top:4px">A follow-on run can continue the conversation from the decision.</p></div>
</div>
